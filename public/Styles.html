  File       : Styles.html — ระบบดีไซน์หลัก (โทเคนสี 60-30-10 · เชลล์ · คอมโพเนนต์)
  Version    : 1.0.0
  Last Update: 2026-08-20
  Developer  : นายอรรถสิทธิ์ คำจารย์
  License    : ใช้งานเพื่อการศึกษาและราชการ
  Notice     : ห้ามจำหน่าย · แบ่งปันเพื่อการศึกษาและต่อยอดเท่านั้น
  ─────────────────────────────────────────────────────────────
  ★ ห้ามเขียน block comment แบบ /* */ นอกแท็ก <style> เด็ดขาด
    ไฟล์นี้ถูก include() เข้า Index.html → ข้อความนอก <style> จะโผล่บนจอ
-->
<style>
/* ═══════════════════════════════════════════════════════════════
   1) โทเคนสี — ทฤษฎี 60-30-10
      60% พื้นหลัก · 30% สีรอง (โครง/แถบข้าง/หัวเรื่อง) · 10% สีเน้น (CTA/สถานะ)
      ★ ทุกคอมโพเนนต์ต้องดึงสีจาก 3 กลุ่มนี้เท่านั้น (ยกเว้นสีความหมาย ok/warn/bad)
      ★ เปลี่ยนชุดโทนสีที่ --brand-* ทีเดียว สัดส่วนทั้งระบบคงเดิม
   ═══════════════════════════════════════════════════════════════ */
:root{
  --brand-50:#eef2ff; --brand-100:#e0e7ff; --brand-200:#c7d2fe; --brand-300:#a5b4fc;
  --brand-400:#818cf8; --brand-500:#6366f1; --brand-600:#4f46e5; --brand-700:#4338ca;
  --brand-800:#3730a3; --brand-900:#312e81; --brand-alt:#8b5cf6;
  --bg:#f3f5fb; --surface:#ffffff; --surface-2:#eaeffa;
  --ink:#0f172a; --ink-2:#475569; --ink-3:#8b97ab; --line:#e3e9f3;
  --c60:var(--bg);
  --c60-raise:var(--surface);
  --c60-sink:var(--surface-2);
  --c60-on:var(--ink);
  --c30:var(--brand-800);
  --c30-soft:var(--brand-50);
  --c30-line:var(--brand-100);
  --c30-on:#ffffff;
  --c10:var(--brand-600);
  --c10-hover:var(--brand-700);
  --c10-on:#ffffff;
  --c10-grad:linear-gradient(135deg,var(--brand-500),var(--brand-alt));
  --c10-ring:var(--brand-200);
  --c10-ring:color-mix(in srgb, var(--brand-500) 38%, transparent);
  --ok:#0ea472; --ok-soft:#e6f9f1;
  --warn:#d97706; --warn-soft:#fef4e6;
  --bad:#dc2626; --bad-soft:#fdeceb;
  --info:#2563eb; --info-soft:#e8effd;
  --acc:#7c3aed; --acc-soft:#f2ebfe;
  --late:#ea580c; --late-soft:#fef0e7;
  --mut:#64748b; --mut-soft:#eef2f7;
  --sh-1:0 1px 2px rgba(15,23,42,.05);
  --sh-2:0 4px 14px rgba(15,23,42,.07);
  --sh-3:0 14px 38px rgba(15,23,42,.12);
  --sh-brand:0 12px 30px rgba(79,70,229,.28);
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:26px;
  --ease:cubic-bezier(.22,.85,.3,1);
  --sidebar-w:274px; --nav-h:66px;
  --f-display:'Kanit',system-ui,-apple-system,sans-serif;
  --f-body:'Sarabun',system-ui,-apple-system,sans-serif;
}
[data-theme="dark"]{
  --bg:#0b1120; --surface:#141d31; --surface-2:#1c2740;
  --ink:#e8eefb; --ink-2:#a3b0c9; --ink-3:#6e7d99; --line:#26324b;
  --brand-50:#1c2547; --brand-100:#232f57; --brand-200:#31407a;
  --c30:var(--brand-300);
  --c30-on:#0b1120;
  --ok-soft:#0c2f24; --warn-soft:#33240c; --bad-soft:#3a1414;
  --info-soft:#0f2247; --acc-soft:#241640; --late-soft:#331a09; --mut-soft:#1c2740;
  --sh-1:0 1px 2px rgba(0,0,0,.4);
  --sh-2:0 4px 16px rgba(0,0,0,.45);
  --sh-3:0 16px 40px rgba(0,0,0,.55);
}

/* ═══════════════════════════════════════════════════════════════
   2) ฐาน
   ═══════════════════════════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--f-body); font-size:14.5px; line-height:1.65;
  background:var(--c60); color:var(--c60-on);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
h1,h2,h3,h4,h5{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:-.01em}
a{color:var(--c10);text-decoration:none}
a:hover{color:var(--c10-hover)}
img{max-width:100%;display:block}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);background-clip:content-box}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ═══════════════════════════════════════════════════════════════
   3) โฮสต์ของ overlay — ★ ต้องซ่อน 2 ชั้น (HTML hidden + CSS [hidden])
      พึ่ง :not([hidden]) อย่างเดียว = ถ้า HTML ลืม attribute จะทับทั้งจอตั้งแต่โหลด
   ═══════════════════════════════════════════════════════════════ */
#modal-host[hidden], #spin-host[hidden], #waffle-host[hidden], #search-host[hidden]{display:none !important}
#modal-host:not([hidden]),#spin-host:not([hidden]),#search-host:not([hidden]){display:flex}

/* ═══════════════════════════════════════════════════════════════
   4) หน้าจอบูต
   ═══════════════════════════════════════════════════════════════ */
#boot{
  position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  background:linear-gradient(160deg,#1e1b4b,#312e81 45%,#4c1d95);
  color:#fff;transition:opacity .45s var(--ease);
}
#boot.is-hide{opacity:0;pointer-events:none}
.boot-logo{
  width:82px;height:82px;border-radius:24px;background:var(--c10-grad);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--c10-on);
  box-shadow:0 20px 50px rgba(99,102,241,.5);animation:bootPulse 2.4s var(--ease) infinite;
}
@keyframes bootPulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.03)}}
.boot-title{font-family:var(--f-display);font-size:19px;font-weight:600}
.boot-sub{font-size:13px;opacity:.72;min-height:20px}
.boot-bar{width:190px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
.boot-bar i{display:block;height:100%;width:38%;border-radius:99px;background:#fff;animation:bootSlide 1.25s var(--ease) infinite}
@keyframes bootSlide{0%{transform:translateX(-110%)}100%{transform:translateX(330%)}}
.boot-err{max-width:440px;text-align:center;font-size:13px;line-height:1.8;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.18);border-radius:var(--r-m);padding:16px 18px}

/* ═══════════════════════════════════════════════════════════════
   5) เชลล์ — ใช้ flex ไม่ใช้ grid (grid เปราะใน iframe ของ GAS)
   ═══════════════════════════════════════════════════════════════ */
.shell{display:flex;flex-direction:row;min-height:100vh;background:var(--c60)}
.sidebar{
  flex:0 0 var(--sidebar-w);width:var(--sidebar-w);
  background:var(--c60-raise);border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60;
}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.content{flex:1 1 auto;padding:22px 26px 60px;max-width:1560px;width:100%;margin:0 auto}

/* ── หัวไซด์บาร์ ─────────────────────────────────────────────── */
.sb-head{padding:17px 16px 13px;border-bottom:1px solid var(--line)}
.sb-brand{display:flex;align-items:center;gap:11px}
.sb-logo{
  position:relative;width:44px;height:44px;border-radius:14px;flex:0 0 44px;
  background:var(--c10-grad);display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--c10-on);
  box-shadow:var(--sh-brand);
}
.sb-logo::after{
  content:'';position:absolute;inset:-5px;border-radius:19px;background:var(--c10-grad);
  filter:blur(14px);opacity:.34;z-index:-1;pointer-events:none;
}
.sb-logo img{width:100%;height:100%;object-fit:cover;border-radius:14px}
.sb-name{font-family:var(--f-display);font-weight:600;font-size:15.5px;line-height:1.25;color:var(--c60-on)}
.sb-org{font-size:11.5px;color:var(--ink-3);line-height:1.35;margin-top:1px}
.sb-clock{
  margin-top:12px;border-radius:var(--r-m);padding:10px 13px;
  background:var(--c30-soft);border:1px solid var(--c30-line);
}
.sb-time{font-family:var(--f-display);font-weight:600;font-size:20px;color:var(--c30);
  font-variant-numeric:tabular-nums;letter-spacing:.4px;line-height:1.2}
.sb-date{font-size:11.5px;color:var(--ink-2);margin-top:1px}
.sb-user{
  margin-top:10px;display:flex;align-items:center;gap:9px;padding:9px 11px;
  border-radius:var(--r-m);background:var(--c60-sink);border:1px solid var(--line);
}
.sb-user .who{min-width:0;flex:1}
.sb-user .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── รายการเมนู (จัดกลุ่มตามภารกิจ) ─────────────────────────── */
.sb-nav{flex:1 1 auto;overflow-y:auto;padding:12px 10px 18px}
.sb-group{margin-bottom:5px}
.sb-gtitle{
  display:flex;align-items:center;gap:7px;padding:9px 10px 6px;
  font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase;
}
.sb-gnum{
  /* พื้นผิวสี 30% จริง (ชิปหมายเลขหมวดภารกิจ) — คู่กับตัวอักษร --c30-on */
  flex:0 0 18px;height:18px;border-radius:6px;background:var(--c30);color:var(--c30-on);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
}
.sb-link{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:9px 11px;margin:1px 0;border-radius:var(--r-s);
  color:var(--ink-2);font-size:13.5px;font-weight:500;cursor:pointer;
  transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease);
}
.sb-link i{font-size:15.5px;width:19px;text-align:center;color:var(--ink-3);transition:color .18s var(--ease)}
.sb-link:hover{background:var(--c60-sink);color:var(--c60-on);transform:translateX(2px)}
.sb-link:hover i{color:var(--c10)}
.sb-link.is-active{background:var(--c30-soft);color:var(--c10);font-weight:600;box-shadow:0 4px 14px rgba(79,70,229,.13)}
.sb-link.is-active i{color:var(--c10)}
.sb-link.is-active::before{
  content:'';position:absolute;left:-10px;top:6px;bottom:6px;width:4px;border-radius:0 4px 4px 0;
  background:var(--c10-grad);box-shadow:0 0 12px rgba(99,102,241,.55);
}
.sb-badge{
  margin-left:auto;min-width:21px;height:19px;padding:0 6px;border-radius:99px;
  background:var(--c30-soft);color:var(--c30);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
}
.sb-badge.is-hot{background:var(--bad-soft);color:var(--bad)}
.sb-foot{padding:11px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-3);text-align:center}

/* ═══════════════════════════════════════════════════════════════
   6) แถบบน
   ═══════════════════════════════════════════════════════════════ */
.navbar{
  position:sticky;top:0;z-index:55;height:var(--nav-h);display:flex;align-items:center;gap:12px;
  padding:0 22px;background:color-mix(in srgb,var(--c60-raise) 86%, transparent);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);
}
.nav-page{display:flex;align-items:center;gap:11px;min-width:0}
.nav-icon{
  flex:0 0 40px;width:40px;height:40px;border-radius:12px;background:var(--c10-grad);
  display:flex;align-items:center;justify-content:center;color:var(--c10-on);font-size:17px;
  box-shadow:var(--sh-brand);
}
.nav-t{font-family:var(--f-display);font-weight:600;font-size:16px;line-height:1.2;white-space:nowrap}
.nav-s{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-spacer{flex:1 1 auto}
.nav-search{
  position:relative;flex:0 1 330px;display:flex;align-items:center;
  background:var(--c60-sink);border:1px solid var(--line);border-radius:99px;
  padding:0 14px;height:40px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
}
.nav-search:focus-within{border-color:var(--c10);box-shadow:0 0 0 4px var(--c10-ring)}
.nav-search i{color:var(--ink-3);font-size:15px}
.nav-search input{flex:1;border:0;background:transparent;outline:none;padding:0 9px;font-size:13.5px}
.nav-search kbd{
  font-family:var(--f-body);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);
  border-radius:5px;padding:1px 5px;background:var(--c60-raise);
}
.icon-btn{
  position:relative;flex:0 0 40px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);
  background:var(--c60-raise);color:var(--ink-2);display:flex;align-items:center;justify-content:center;
  font-size:16px;cursor:pointer;transition:all .18s var(--ease);
}
.icon-btn:hover{color:var(--c10);border-color:var(--c10-ring);transform:translateY(-1px);box-shadow:var(--sh-2)}
.icon-btn .dot{
  position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:99px;
  background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--c60-raise);
}
.nav-pill{
  display:flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:99px;
  background:var(--c60-sink);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap;
}
.nav-pill .live{width:7px;height:7px;border-radius:99px;background:var(--ok);animation:livePulse 2s infinite}
@keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(14,164,114,.5)}70%{box-shadow:0 0 0 7px rgba(14,164,114,0)}}
.nav-prof{
  display:flex;align-items:center;gap:9px;padding:5px 12px 5px 5px;border-radius:99px;
  border:1px solid var(--line);background:var(--c60-raise);cursor:pointer;transition:all .18s var(--ease);
}
.nav-prof:hover{border-color:var(--c10-ring);box-shadow:var(--sh-2)}
.nav-prof .nm{font-size:12.5px;font-weight:600;line-height:1.15}
.nav-prof .rl{font-size:10.5px;color:var(--ink-3);line-height:1.15}
.menu-btn{display:none}

/* ── แผงลอย (popover) ────────────────────────────────────────── */
.pop{
  position:absolute;top:calc(var(--nav-h) - 6px);right:20px;z-index:70;width:330px;
  background:var(--c60-raise);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh-3);overflow:hidden;animation:popIn .2s var(--ease);
}
@keyframes popIn{from{opacity:0;transform:translateY(-8px) scale(.97)}to{opacity:1;transform:none}}
.pop-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px}
.pop-h .t{font-family:var(--f-display);font-weight:600;font-size:14px}
.pop-b{max-height:390px;overflow-y:auto}
.pop-f{padding:9px 14px;border-top:1px solid var(--line);text-align:center}
.pop-item{
  display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line);cursor:pointer;
  transition:background .16s var(--ease);
}
.pop-item:last-child{border-bottom:0}
.pop-item:hover{background:var(--c60-sink)}
.pop-item.is-unread{background:var(--c30-soft)}
.pop-ic{
  flex:0 0 34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:14px;
}
.pop-item .t{font-size:13px;font-weight:600;line-height:1.35}
.pop-item .d{font-size:11.5px;color:var(--ink-2);line-height:1.45}
.pop-item .w{font-size:10.5px;color:var(--ink-3);margin-top:2px}
.pop-list{padding:6px}
.pop-row{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-s);
  font-size:13.5px;cursor:pointer;color:var(--ink-2);transition:all .16s var(--ease);
}
.pop-row:hover{background:var(--c60-sink);color:var(--c60-on)}
.pop-row i{width:18px;text-align:center;color:var(--ink-3)}
.pop-row:hover i{color:var(--c10)}
.pop-row.is-danger{color:var(--bad)}
.pop-row.is-danger i{color:var(--bad)}
.pop-sep{height:1px;background:var(--line);margin:5px 8px}

/* ── App Launcher (ตารางแบบ waffle) ─────────────────────────── */
#waffle-host{position:absolute;top:calc(var(--nav-h) - 6px);right:20px;z-index:72}
.waffle{
  width:340px;background:var(--c60-raise);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh-3);padding:12px;animation:popIn .2s var(--ease);
}
.waffle-t{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-3);
  text-transform:uppercase;padding:3px 6px 9px}
.waffle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.waffle-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;
  border-radius:var(--r-m);cursor:pointer;text-align:center;transition:all .18s var(--ease);
  border:1px solid transparent;
}
.waffle-item:hover{background:var(--c60-sink);transform:translateY(-2px)}
.waffle-item.is-active{background:var(--c30-soft);border-color:var(--c30-line)}
.waffle-ic{
  width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--c10-on);background:var(--c10-grad);box-shadow:0 6px 14px rgba(79,70,229,.22);
}
.waffle-item .lb{font-size:11.5px;font-weight:500;line-height:1.3;color:var(--ink-2)}
.waffle-item.is-active .lb{color:var(--c10);font-weight:600}
.waffle-btn.is-overflow{color:var(--c10);border-color:var(--c10-ring)}

/* ═══════════════════════════════════════════════════════════════
   7) ฮีโร่ + แถบ KPI
   ═══════════════════════════════════════════════════════════════ */
.hero{
  position:relative;overflow:hidden;border-radius:var(--r-xl);padding:26px 28px;
  background:linear-gradient(125deg,var(--brand-700),var(--brand-500) 52%,var(--brand-alt));
  color:#fff;box-shadow:var(--sh-brand);margin-bottom:20px;
}
.hero::before{
  content:'';position:absolute;top:-60%;left:-14%;width:56%;height:230%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);
  transform:rotate(16deg);pointer-events:none;animation:beam 7s var(--ease) infinite;
}
@keyframes beam{0%{left:-40%}55%,100%{left:118%}}
.hero::after{
  content:'';position:absolute;right:-40px;bottom:-70px;width:250px;height:250px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.2),transparent 68%);pointer-events:none;
}
.hero-top{position:relative;z-index:1;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.hero-pill{
  display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;
  background:rgba(255,255,255,.19);border:1px solid rgba(255,255,255,.28);
  font-size:11.5px;font-weight:600;margin-bottom:9px;backdrop-filter:blur(8px);
}
.hero h1{font-size:25px;font-weight:600;line-height:1.25;color:#fff}
.hero .sub{font-size:13.5px;opacity:.9;margin-top:5px;max-width:620px}
.hero-deco{
  flex:0 0 74px;width:74px;height:74px;border-radius:22px;margin-left:auto;
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.26);
  display:flex;align-items:center;justify-content:center;font-size:31px;backdrop-filter:blur(8px);
}
.hero-act{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.kpi-strip{
  position:relative;z-index:1;display:grid;gap:11px;margin-top:20px;
  grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
}
.kpi{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.24);border-radius:var(--r-m);
  padding:13px 15px;backdrop-filter:blur(10px);transition:transform .22s var(--ease),background .22s var(--ease);
}
.kpi:hover{transform:translateY(-3px);background:rgba(255,255,255,.23)}
.kpi .lb{font-size:11.5px;opacity:.88;display:flex;align-items:center;gap:5px}
.kpi .vl{font-family:var(--f-display);font-size:26px;font-weight:600;line-height:1.15;margin-top:3px;
  font-variant-numeric:tabular-nums}
.kpi .vl small{font-size:12.5px;font-weight:400;opacity:.85;margin-left:3px}
.kpi .dt{font-size:11px;opacity:.82;margin-top:1px}

/* ═══════════════════════════════════════════════════════════════
   8) การ์ด / แผง
   ═══════════════════════════════════════════════════════════════ */
.panel{
  background:var(--c60-raise);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--sh-1);margin-bottom:18px;overflow:hidden;
}
.panel-h{display:flex;align-items:center;gap:11px;padding:15px 19px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-ic{
  flex:0 0 34px;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:15px;background:var(--c30-soft);color:var(--c10);
}
.panel-t{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.25}
.panel-s{font-size:11.5px;color:var(--ink-3)}
.panel-b{padding:18px 19px}
.panel-b.is-flush{padding:0}
.panel-f{padding:12px 19px;border-top:1px solid var(--line);background:var(--c60-sink)}
.grid{display:grid;gap:15px}
.grid.g-auto{grid-template-columns:repeat(auto-fill,minmax(292px,1fr))}
.grid.g-wide{grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.grid.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.g-side{grid-template-columns:minmax(0,1fr) 350px}
.stack{display:flex;flex-direction:column;gap:15px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.is-end{justify-content:flex-end}
.row.is-between{justify-content:space-between}

/* ── การ์ดสถิติ ─────────────────────────────────────────────── */
.stat{
  position:relative;overflow:hidden;background:var(--c60-raise);border:1px solid var(--line);
  border-radius:var(--r-l);padding:17px 19px;box-shadow:var(--sh-1);
  transition:transform .24s var(--ease),box-shadow .24s var(--ease);
}
.stat::before{
  content:'';position:absolute;top:0;left:-120%;width:65%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  transition:left .85s var(--ease);pointer-events:none;
}
.stat:hover{transform:translateY(-4px) scale(1.012);box-shadow:var(--sh-3)}
.stat:hover::before{left:132%}
.stat-top{display:flex;align-items:flex-start;gap:12px}
.stat-ic{
  position:relative;flex:0 0 46px;width:46px;height:46px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;
}
.stat-ic::after{content:'';position:absolute;inset:-4px;border-radius:18px;filter:blur(11px);opacity:.4;
  background:inherit;z-index:-1;pointer-events:none}
.stat .lb{font-size:12.5px;color:var(--ink-2);font-weight:500}
.stat .vl{font-family:var(--f-display);font-size:27px;font-weight:600;line-height:1.2;
  font-variant-numeric:tabular-nums;color:var(--c60-on)}
.stat .vl small{font-size:13px;font-weight:400;color:var(--ink-3);margin-left:3px}
.stat .dt{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.stat-link{
  display:flex;align-items:center;gap:5px;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--line);font-size:12px;font-weight:600;color:var(--c10);cursor:pointer;
}
.stat-link i{transition:transform .2s var(--ease)}
.stat:hover .stat-link i{transform:translateX(3px)}
.sd-stagger>*{opacity:0;animation:rise .5s var(--ease) forwards}
.sd-stagger>*:nth-child(1){animation-delay:.03s}
.sd-stagger>*:nth-child(2){animation-delay:.08s}
.sd-stagger>*:nth-child(3){animation-delay:.13s}
.sd-stagger>*:nth-child(4){animation-delay:.18s}
.sd-stagger>*:nth-child(5){animation-delay:.23s}
.sd-stagger>*:nth-child(6){animation-delay:.28s}
.sd-stagger>*:nth-child(n+7){animation-delay:.33s}
@keyframes rise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}

/* ── โทนสีความหมาย (ใช้กับ .stat-ic / .pop-ic / .tl-ic) ─────── */
.t-brand{background:var(--c10-grad)}
.t-ok{background:linear-gradient(135deg,#10b981,#059669)}
.t-warn{background:linear-gradient(135deg,#f59e0b,#d97706)}
.t-bad{background:linear-gradient(135deg,#f43f5e,#dc2626)}
.t-info{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.t-acc{background:linear-gradient(135deg,#a855f7,#7c3aed)}
.t-late{background:linear-gradient(135deg,#fb923c,#ea580c)}
.t-mut{background:linear-gradient(135deg,#94a3b8,#64748b)}
.s-brand{background:var(--c30-soft);color:var(--c10)}
.s-ok{background:var(--ok-soft);color:var(--ok)}
.s-warn{background:var(--warn-soft);color:var(--warn)}
.s-bad{background:var(--bad-soft);color:var(--bad)}
.s-info{background:var(--info-soft);color:var(--info)}
.s-acc{background:var(--acc-soft);color:var(--acc)}
.s-late{background:var(--late-soft);color:var(--late)}
.s-mut{background:var(--mut-soft);color:var(--mut)}

/* ═══════════════════════════════════════════════════════════════
   9) ปุ่ม
   ═══════════════════════════════════════════════════════════════ */
.btn{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  height:40px;padding:0 17px;border-radius:var(--r-s);border:1px solid transparent;
  font-family:var(--f-display);font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:transform .16s var(--ease),box-shadow .16s var(--ease),background .16s var(--ease);
}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:not(:disabled):hover{transform:translateY(-1px)}
.btn:not(:disabled):active{transform:translateY(0)}
.btn-primary{background:var(--c10-grad);color:var(--c10-on);box-shadow:var(--sh-brand)}
.btn-primary:not(:disabled):hover{box-shadow:0 16px 34px rgba(79,70,229,.36)}
.btn-ghost{background:var(--c60-raise);color:var(--ink-2);border-color:var(--line)}
.btn-ghost:not(:disabled):hover{color:var(--c10);border-color:var(--c10-ring);box-shadow:var(--sh-2)}
.btn-soft{background:var(--c30-soft);color:var(--c10);border-color:var(--c30-line)}
.btn-soft:not(:disabled):hover{background:var(--c30-line)}
.btn-danger{background:linear-gradient(135deg,#f43f5e,#dc2626);color:#fff;box-shadow:0 10px 24px rgba(220,38,38,.28)}
.btn-ok{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 10px 24px rgba(16,185,129,.26)}
.btn-glass{background:rgba(255,255,255,.19);color:#fff;border-color:rgba(255,255,255,.3);backdrop-filter:blur(8px)}
.btn-glass:not(:disabled):hover{background:rgba(255,255,255,.3)}
.btn-sm{height:33px;padding:0 12px;font-size:12.5px}
.btn-lg{height:47px;padding:0 24px;font-size:15px}
.btn-block{width:100%}
.btn-icon{width:40px;padding:0;flex:0 0 40px}
.btn-sm.btn-icon{width:33px;flex:0 0 33px}
.ripple{
  position:absolute;border-radius:50%;background:rgba(255,255,255,.55);
  transform:scale(0);animation:rip .55s linear;pointer-events:none;
}
@keyframes rip{to{transform:scale(3.6);opacity:0}}

/* ── ปุ่มบันทึกแบบ 4 สถานะ ──────────────────────────────────── */
/* ★ ซ้อน 4 สถานะด้วย grid ช่องเดียวกัน ไม่ใช่ position:absolute
   เพราะ absolute ทำให้ความกว้างปุ่มมาจาก .st-idle ตัวเดียว → ข้อความสถานะอื่น
   ที่ยาวกว่า ("กำลังบันทึก…") ล้นออกนอกปุ่มและถูกตัดทิ้ง
   grid ช่องเดียวกันทำให้ปุ่มกว้างเท่า "สถานะที่ยาวที่สุด" ตั้งแต่แรก */
.btn[data-state]{position:relative;display:inline-grid;align-items:center;justify-items:center}
.btn[data-state] .st{
  grid-area:1/1;display:flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;
  opacity:0;transform:translateY(7px);transition:opacity .2s var(--ease),transform .2s var(--ease);
}
.btn[data-state] .st-idle{opacity:1;transform:none}
.btn[data-state="loading"] .st-idle,
.btn[data-state="success"] .st-idle,
.btn[data-state="error"] .st-idle{opacity:0;transform:translateY(-7px)}
.btn[data-state="loading"] .st-loading,
.btn[data-state="success"] .st-success,
.btn[data-state="error"] .st-error{opacity:1;transform:none}
.btn[data-state="success"]{background:linear-gradient(135deg,#10b981,#059669)}
.btn[data-state="error"]{background:linear-gradient(135deg,#f43f5e,#dc2626)}
.btn[data-state="loading"]{pointer-events:none}
/* ★ flex:0 0 auto บังคับ — ตัวหมุนเป็นลูกของแถว flex ถ้าแถวล้นเมื่อไร
   มันจะถูกบีบด้านกว้างจนกลายเป็นวงรี แล้วหมุนออกมาเป็นรูปทรงบิดเบี้ยว */
.spin-i{flex:0 0 auto;box-sizing:border-box;width:15px;height:15px;border-radius:50%;
  border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ═══════════════════════════════════════════════════════════════
   10) ฟอร์ม
   ═══════════════════════════════════════════════════════════════ */
.field{margin-bottom:14px}
.field > label:not(.switch):not(.pick){
  display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px;
}
.field .req{color:var(--bad);margin-left:2px}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.5}
.field .err{font-size:11.5px;color:var(--bad);margin-top:4px;display:none}
.field.is-err .err{display:block}
.field.is-err .inp,.field.is-err .sel,.field.is-err .txt{border-color:var(--bad)}
.inp,.sel,.txt{
  width:100%;height:42px;padding:0 13px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--c60-raise);color:var(--c60-on);
  outline:none;transition:border-color .18s var(--ease),box-shadow .18s var(--ease);font-size:14px;
}
.txt{height:auto;min-height:96px;padding:11px 13px;resize:vertical;line-height:1.65}
.sel{appearance:none;padding-right:36px;cursor:pointer;
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' fill='%238b97ab'%3E%3Cpath d='M8 11.5 3.5 7h9z'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 12px center;background-size:15px}
.inp:focus,.sel:focus,.txt:focus{border-color:var(--c10);box-shadow:0 0 0 4px var(--c10-ring)}
.inp::placeholder,.txt::placeholder{color:var(--ink-3)}
.inp:disabled,.sel:disabled,.txt:disabled{background:var(--c60-sink);color:var(--ink-3);cursor:not-allowed}
.inp-wrap{position:relative;display:flex;align-items:center}
.inp-wrap > i{position:absolute;left:13px;color:var(--ink-3);font-size:15px;pointer-events:none;z-index:1}
.inp-wrap .inp{padding-left:38px}
.inp-wrap .tail{position:absolute;right:8px;display:flex;gap:4px}
.form-grid{display:grid;gap:0 15px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.form-grid .full{grid-column:1/-1}

/* ── สวิตช์ / ตัวเลือกแบบปุ่ม ───────────────────────────────── */
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .track{
  flex:0 0 44px;width:44px;height:25px;border-radius:99px;background:var(--line);
  position:relative;transition:background .22s var(--ease);
}
.switch .track::after{
  content:'';position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;
  background:#fff;box-shadow:var(--sh-1);transition:transform .22s var(--ease);
}
.switch input:checked + .track{background:var(--c10)}
.switch input:checked + .track::after{transform:translateX(19px)}
.switch .lb{font-size:13.5px;font-weight:500}
.pick{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;
  border:1px solid var(--line);background:var(--c60-raise);cursor:pointer;
  font-size:13px;font-weight:500;color:var(--ink-2);transition:all .18s var(--ease);
}
.pick input{position:absolute;opacity:0;width:0;height:0}
.pick:hover{border-color:var(--c10-ring)}
.pick input:checked ~ .pk{color:var(--c10)}
.pick.is-on{background:var(--c30-soft);border-color:var(--c10);color:var(--c10);font-weight:600}
.pick-grid{display:flex;flex-wrap:wrap;gap:8px}

/* ── อัปโหลดรูป ─────────────────────────────────────────────── */
.upload{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-m);
  border:1.5px dashed var(--line);background:var(--c60-sink);transition:border-color .2s var(--ease);
}
.upload:hover{border-color:var(--c10)}
.upload-pv{
  flex:0 0 78px;width:78px;height:78px;border-radius:var(--r-m);overflow:hidden;
  background:var(--c60-raise);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:26px;
}
.upload-pv img{width:100%;height:100%;object-fit:cover}
.upload input[type=file]{display:none}

/* ═══════════════════════════════════════════════════════════════
   11) แถบเครื่องมือ / ชิป / ตัวกรอง
   ═══════════════════════════════════════════════════════════════ */
.toolbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 17px;margin-bottom:16px;
  background:var(--c60-raise);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh-1);
}
.tb-search{position:relative;flex:1 1 235px;min-width:180px}
.tb-search i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:15px}
.tb-search .inp{padding-left:38px}
.tb-sel{flex:0 1 170px;min-width:132px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:33px;padding:0 13px;border-radius:99px;
  border:1px solid var(--line);background:var(--c60-raise);color:var(--ink-2);
  font-size:12.5px;font-weight:500;cursor:pointer;transition:all .18s var(--ease);white-space:nowrap;
}
.chip:hover{border-color:var(--c10-ring);color:var(--c10)}
.chip.is-on{background:var(--c10-grad);color:var(--c10-on);border-color:transparent;box-shadow:0 6px 15px rgba(79,70,229,.24)}
.chip .n{font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--c60-sink);color:var(--ink-2)}
.chip.is-on .n{background:rgba(255,255,255,.26);color:#fff}
.view-toggle{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--c60-raise)}
.view-toggle button{
  width:38px;height:38px;border:0;background:transparent;color:var(--ink-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .18s var(--ease);
}
.view-toggle button.is-on{background:var(--c30-soft);color:var(--c10)}

/* ═══════════════════════════════════════════════════════════════
   12) ป้ายสถานะ / ชิปบทบาท / อวาตาร์
   ═══════════════════════════════════════════════════════════════ */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;
  font-size:11.5px;font-weight:600;white-space:nowrap;line-height:1.6;
}
.badge i{font-size:11px}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.b-info{background:var(--info-soft);color:var(--info)}
.b-acc{background:var(--acc-soft);color:var(--acc)}
.b-late{background:var(--late-soft);color:var(--late)}
.b-mut{background:var(--mut-soft);color:var(--mut)}
.b-brand{background:var(--c30-soft);color:var(--c10)}
.badge.is-pulse{animation:bpulse 1.8s var(--ease) infinite}
@keyframes bpulse{0%,100%{box-shadow:0 0 0 0 currentColor}55%{box-shadow:0 0 0 5px transparent}}
.role-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;
  font-size:11px;font-weight:600;line-height:1.7}
.role-admin{background:var(--bad-soft);color:var(--bad)}
.role-director{background:var(--acc-soft);color:var(--acc)}
.role-homeroom{background:var(--c30-soft);color:var(--c10)}
.role-teacher{background:var(--info-soft);color:var(--info)}
.role-parent{background:var(--ok-soft);color:var(--ok)}
.avt{
  flex:0 0 auto;border-radius:50%;overflow:hidden;background:var(--c10-grad);color:var(--c10-on);
  display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:600;
  width:40px;height:40px;font-size:14px;
}
.avt img{width:100%;height:100%;object-fit:cover}
.avt.sm{width:32px;height:32px;font-size:12px}
.avt.lg{width:56px;height:56px;font-size:19px}
.avt.xl{width:82px;height:82px;font-size:27px;border-radius:24px}
.avt.sq{border-radius:var(--r-m)}
.avt-ring{box-shadow:0 0 0 3px var(--c60-raise),0 0 0 5px var(--c10-ring)}

/* ═══════════════════════════════════════════════════════════════
   13) โมดัล
   ═══════════════════════════════════════════════════════════════ */
#modal-host{
  position:fixed;inset:0;z-index:200;align-items:center;justify-content:center;padding:22px;
  background:rgba(15,23,42,.55);backdrop-filter:blur(5px);animation:fade .2s var(--ease);
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{
  width:100%;max-width:560px;max-height:calc(100vh - 44px);display:flex;flex-direction:column;
  background:var(--c60-raise);border-radius:var(--r-xl);box-shadow:var(--sh-3);overflow:hidden;
  animation:modalIn .28s var(--ease);
}
@keyframes modalIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.modal-card.is-lg{max-width:840px}
.modal-card.is-xl{max-width:1120px}
.modal-h{display:flex;align-items:center;gap:11px;padding:17px 21px;border-bottom:1px solid var(--line)}
.modal-h .t{font-family:var(--f-display);font-weight:600;font-size:16px;flex:1;min-width:0}
.modal-b{padding:20px 21px;overflow-y:auto;flex:1 1 auto}
.modal-f{display:flex;gap:9px;justify-content:flex-end;padding:14px 21px;border-top:1px solid var(--line);
  background:var(--c60-sink);flex-wrap:wrap}
.modal-card.is-custom .modal-h{display:none}
.mh-hero{
  position:relative;overflow:hidden;padding:22px 24px;color:#fff;
  background:linear-gradient(125deg,var(--brand-700),var(--brand-500) 55%,var(--brand-alt));
}

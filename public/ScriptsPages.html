<script type="text/x-app-pages">
(function (W) {
  'use strict';
  var A = W.APP;
  var $ = A.$, $$ = A.$$, esc = A.esc, fmt = A.fmt, num = A.num, TH = A.TH;
  var Store = A.Store, call = A.call, hasCap = A.hasCap, toast = A.toast;
  var hero = A.hero, panel = A.panel, statCard = A.statCard, emptyBox = A.emptyBox;
  var errorBox = A.errorBox, skeleton = A.skeleton, pager = A.pager, avatar = A.avatar;
  var badge = A.badge, modal = A.modal, modalClose = A.modalClose, runAction = A.runAction;
  var buttonStates = A.buttonStates, confirmBox = A.confirmBox, selectOptions = A.selectOptions;
  var Routes = A.Routes;

  /* guard — กัน race condition: ผู้ใช้เปลี่ยนหน้า/ออกจากระบบระหว่างรอคำตอบ */
  function guard(hash) {
    if (!Store.user) return null;
    if (A.currentHash() !== hash) return null;
    return $('#page');
  }
  function loading(page, kind) { if (page) page.innerHTML = skeleton(kind || 'hero'); }
  function fail(hash, e) {
    var p = guard(hash);
    if (p) p.innerHTML = errorBox((e && e.message) || String(e), hash);
  }

  /* ── หัวเอกสารสำหรับพิมพ์ (โผล่เฉพาะตอนสั่งพิมพ์) ───────────
     "มีปุ่มพิมพ์" ≠ "ได้เอกสารที่ยื่นได้" — ต้องมีหัวกระดาษ ตัวกรอง และช่องลงนามครบ */
  function docHead(title, filterText) {
    var st = Store.settings || {};
    return '<div class="pr-only doc-head">' +
      (st.logo_image ? '<img class="doc-logo" src="' + esc(st.logo_image) + '" alt="ตราโรงเรียน" referrerpolicy="no-referrer">' : '') +
      '<div class="doc-org">' + esc(st.org_name || '') + '</div>' +
      '<div class="doc-sub">' + esc(st.org_affiliation || '') + '</div>' +
      '<div class="doc-title">' + esc(title) + '</div>' +
      (filterText ? '<div class="doc-filter">' + esc(filterText) + '</div>' : '') +
      '<hr class="doc-line">' +
      '</div>';
  }

  function docSign(roles) {
    var st = Store.settings || {};
    var list = roles || [
      { role: 'ผู้จัดทำ / ครูประจำชั้น', name: (Store.user || {}).full_name || '' },
      { role: st.academic_head_position || 'หัวหน้าฝ่ายวิชาการ', name: st.academic_head_name || '' },
      { role: st.director_position || 'ผู้อำนวยการโรงเรียน', name: st.director_name || '' }
    ];
    var boxes = list.map(function (r) {
      return '<div class="sign-b"><div class="sign-l"></div>' +
        '<div>( ' + esc(r.name || '.'.repeat(24)) + ' )</div>' +
        '<div>' + esc(r.role) + '</div></div>';
    }).join('');
    return '<div class="pr-only">' +
      '<div class="doc-sign">' + boxes + '</div>' +
      '<div class="doc-foot">พิมพ์เมื่อ ' + esc(TH.dateLong(new Date())) + ' ' + esc(TH.time(new Date())) +
      ' · จากระบบ CLASSHUB</div>' +
      '</div>';
  }

  function printBtn(label) {
    return '<button class="btn btn-ghost" type="button" data-action="print" ' +
      'title="เปิดหน้าต่างพิมพ์ — เลือก ปลายทาง: บันทึกเป็น PDF เพื่อได้ไฟล์ PDF">' +
      '<i class="bi bi-printer-fill"></i> ' + esc(label || 'พิมพ์ / บันทึก PDF') + '</button>';
  }

  /* ═══════════════════════════════════════════════════════════
     หน้าหลัก — แดชบอร์ด
     ═══════════════════════════════════════════════════════════ */
  Routes['#/'] = {
    cap: 'dashboard.view',
    render: function (page) {
      if (Store.home) { paintHome(page, Store.home); return; }
      loading(page, 'hero');
      call('home.dashboard', {}).then(function (d) {
        var p = guard('#/');
        if (!p) return;
        Store.home = d;
        paintHome(p, d);
      }).catch(function (e) { fail('#/', e); });
    }
  };

  function paintHome(page, d) {
    if (!page || !d) return;
    var k = d.kpi || {};
    var today = d.date || TH.iso(new Date());
    var rate = num(k.rate_today, 0);

    var heroHtml = hero({
      pill: d.year_label || 'ยังไม่ได้ตั้งปีการศึกษา', pillIcon: 'calendar2-check-fill',
      title: 'สวัสดี ' + ((Store.user || {}).full_name || ''),
      sub: 'ภาพรวมงานธุรการชั้นเรียน ประจำ' + TH.dateWeekday(today),
      icon: 'grid-1x2-fill',
      actions:
        (d.can && d.can.attendance ? '<button class="btn btn-glass" type="button" data-hash="#/attendance">' +
          '<i class="bi bi-ui-checks"></i> เช็กชื่อวันนี้</button>' : '') +
        '<button class="btn btn-glass" type="button" data-hash="#/tasks">' +
        '<i class="bi bi-list-task"></i> งานที่ต้องทำ ' + (Store.tasksCount ? '(' + Store.tasksCount + ')' : '') + '</button>' +
        '<button class="btn btn-glass" type="button" data-action="refresh">' +
        '<i class="bi bi-arrow-clockwise"></i> รีเฟรช</button>',
      kpis: [
        { icon: 'people-fill', label: 'นักเรียนทั้งหมด', value: fmt(k.students), unit: 'คน', detail: 'ชาย ' + fmt(k.male) + ' · หญิง ' + fmt(k.female) },
        { icon: 'check-circle-fill', label: 'มาเรียนวันนี้', value: fmt(k.present), unit: 'คน', detail: 'คิดเป็น ' + rate + '%' },
        { icon: 'x-circle-fill', label: 'ขาดเรียนวันนี้', value: fmt(k.absent), unit: 'คน', detail: k.unchecked ? 'ยังไม่เช็ก ' + fmt(k.unchecked) + ' คน' : 'เช็กชื่อครบแล้ว' },
        { icon: 'heart-pulse-fill', label: 'ลาป่วย', value: fmt(k.sick), unit: 'คน' },
        { icon: 'briefcase-fill', label: 'ลากิจ', value: fmt(k.leave), unit: 'คน' },
        { icon: 'clock-fill', label: 'มาสาย', value: fmt(k.late), unit: 'คน' }
      ]
    });

    var statsHtml =
      '<div class="grid g-auto sd-stagger" style="margin-bottom:18px">' +
      statCard({ icon: 'person-exclamation', tone: 'warn', label: 'นักเรียนที่ต้องติดตาม', value: fmt(k.watch), unit: 'คน', detail: 'จากการคัดกรองและเปิดเคส', link: '#/cases', linkText: 'ดูรายละเอียด' }) +
      statCard({ icon: 'life-preserver', tone: 'bad', label: 'เคสที่ยังไม่ปิด', value: fmt(k.cases_open), unit: 'เคส', detail: 'อยู่ระหว่างการช่วยเหลือ', link: '#/cases', linkText: 'จัดการเคส' }) +
      statCard({ icon: 'house-heart-fill', tone: 'ok', label: 'เยี่ยมบ้านแล้ว', value: fmt(k.visits), unit: 'ครั้ง', detail: 'สะสมทั้งปีการศึกษา', link: '#/visits', linkText: 'ดูบันทึก' }) +
      statCard({ icon: 'telephone-fill', tone: 'info', label: 'ติดต่อผู้ปกครองเดือนนี้', value: fmt(k.contacts_month), unit: 'ครั้ง', detail: 'ทุกช่องทางรวมกัน', link: '#/contacts', linkText: 'ดูประวัติ' }) +
      '</div>';

    var trendData = (d.trend || []).map(function (t) {
      return { label: TH.dayShort(t.date), value: t.rate };
    });
    var chartHtml =
      '<div class="grid g-2" style="margin-bottom:18px">' +
      panel({
        title: 'สถิติการมาเรียน (7 วันล่าสุด)', sub: 'อัตราการมาเรียนรายวัน (%)', icon: 'graph-up-arrow', tone: 'ok',
        body: A.svgLineChart({ id: 'att7', data: trendData, max: 100, suffix: '%', title: 'อัตราการมาเรียน 7 วันล่าสุด' })
      }) +
      panel({
        title: 'สรุปพฤติกรรม / คุณลักษณะ', sub: 'สัดส่วนบันทึกพฤติกรรมทั้งหมด ' + fmt(d.behavior_total) + ' รายการ',
        icon: 'emoji-smile-fill', tone: 'acc',
        body: A.svgDonut({ data: d.behavior || [], centerLabel: 'รวมทั้งหมด', title: 'สัดส่วนพฤติกรรม' })
      }) +
      '</div>';

    var quick = quickActions(d.can || {});
    var tasksHtml = panel({
      title: 'งานที่ต้องดำเนินการ', sub: 'เรียงตามความเร่งด่วน', icon: 'list-task', tone: 'warn',
      tools: '<button class="btn btn-ghost btn-sm" type="button" data-hash="#/tasks">ดูทั้งหมด</button>',
      flush: true,
      body: (d.tasks || []).length ? '<div class="lst">' + (d.tasks || []).slice(0, 6).map(taskRow).join('') + '</div>'
        : emptyBox({ icon: 'check2-circle', title: 'ไม่มีงานค้าง', text: 'งานประจำวันของคุณเรียบร้อยทั้งหมดแล้ว ทำได้ดีมาก' })
    });

    var weekly = (d.weekly || []).map(function (wk) {
      var pct = wk.total ? Math.round((wk.present / wk.total) * 100) : 0;
      return '<div class="bar-row">' +
        '<span class="bar-lb">' + esc(wk.label) + '</span>' +
        '<span class="bar-tr"><span class="bar-fl" style="width:' + pct + '%"></span></span>' +
        '<span class="bar-vl">' + (wk.total ? wk.present + '/' + wk.total + ' (' + pct + '%)' : '—') + '</span>' +
        '</div>';
    }).join('');
    var weeklyHtml = panel({
      title: 'สรุปการมาเรียนรายสัปดาห์', sub: 'จันทร์ถึงศุกร์ของสัปดาห์ล่าสุด', icon: 'calendar-week-fill', tone: 'info',
      body: weekly ? '<div class="bars">' + weekly + '</div>'
        : emptyBox({ icon: 'calendar-x', title: 'ยังไม่มีข้อมูลการมาเรียน', text: 'เมื่อเริ่มเช็กชื่อ สรุปรายสัปดาห์จะแสดงที่นี่' }),
      foot: '<button class="btn btn-ghost btn-sm" type="button" data-hash="#/att-history">' +
        '<i class="bi bi-clock-history"></i> ดูรายละเอียดเพิ่มเติม</button>'
    });

    var tlHtml = panel({
      title: 'กิจกรรมล่าสุด', sub: 'สิ่งที่เกิดขึ้นในระบบ', icon: 'activity', tone: 'brand', flush: true,
      body: (d.timeline || []).length
        ? '<div class="panel-b"><div class="tl">' + (d.timeline || []).slice(0, 8).map(function (t) {
          return '<div class="tl-item">' +
            '<div class="tl-ic t-' + esc(t.tone || 'mut') + '"><i class="bi bi-' + esc(t.icon) + '"></i></div>' +
            '<div class="tl-t">' + esc(t.title) + '</div>' +
            '<div class="tl-d">' + esc(t.sub || '') + '</div>' +
            '<div class="tl-w"><i class="bi bi-clock"></i> ' + esc(TH.smart(t.date)) +
            (t.time ? ' ' + esc(t.time) + ' น.' : '') + (t.by ? ' · ' + esc(t.by) : '') + '</div>' +
            '</div>';
        }).join('') + '</div></div>'
        : emptyBox({ icon: 'activity', title: 'ยังไม่มีกิจกรรม', text: 'เมื่อมีการบันทึกงาน กิจกรรมล่าสุดจะแสดงที่นี่' })
    });

    var watchHtml = panel({
      title: 'นักเรียนที่ต้องติดตาม', sub: 'เรียงตามระดับความเร่งด่วน', icon: 'person-exclamation', tone: 'bad', flush: true,
      tools: '<button class="btn btn-ghost btn-sm" type="button" data-hash="#/students?watch=1">ดูทั้งหมด</button>',
      body: (d.watch_list || []).length ? '<div class="lst">' + (d.watch_list || []).map(function (s) {
        return '<div class="lst-row" data-hash="#/student?id=' + esc(s.id) + '">' +
          avatar({ url: s.photo_url, name: s.name, size: 'sm' }) +
          '<div class="main"><div class="t">' + esc(s.name) +
          (s.nickname ? ' <small style="color:var(--ink-3)">(' + esc(s.nickname) + ')</small>' : '') + '</div>' +
          '<div class="s">' + esc(s.class_name) + '</div></div>' +
          '<div class="r">' + badge(s.watch_level, s.watch_level === 'ส่งต่อ' ? 'bad' : 'warn') + '</div>' +
          '</div>';
      }).join('') + '</div>'
        : emptyBox({ icon: 'emoji-smile', title: 'ไม่มีนักเรียนที่ต้องติดตาม', text: 'นักเรียนทุกคนอยู่ในเกณฑ์ปกติ' })
    });

    var upHtml = panel({
      title: 'กิจกรรมที่กำลังจะมาถึง', sub: 'จากปฏิทินกิจกรรมของโรงเรียน', icon: 'flag-fill', tone: 'acc', flush: true,
      body: (d.upcoming || []).length ? '<div class="lst">' + (d.upcoming || []).map(function (a) {
        return '<div class="lst-row" data-hash="#/activities">' +
          '<div class="panel-ic s-acc" style="flex-direction:column;height:44px;flex:0 0 44px">' +
          '<b style="font-size:15px;line-height:1">' + esc(TH.parse(a.date) ? TH.parse(a.date).getDate() : '') + '</b>' +
          '<span style="font-size:9.5px">' + esc(TH.dayShort(a.date).split(' ')[1] || '') + '</span></div>' +
          '<div class="main"><div class="t">' + esc(a.name) + '</div>' +
          '<div class="s"><i class="bi bi-clock"></i> ' + esc(a.time_start ? TH.time(a.time_start) : 'ทั้งวัน') +
          (a.place ? ' · <i class="bi bi-geo-alt"></i> ' + esc(a.place) : '') + '</div></div>' +
          '</div>';
      }).join('') + '</div>'
        : emptyBox({ icon: 'calendar-plus', title: 'ยังไม่มีกิจกรรมที่กำหนดไว้', text: 'เพิ่มกิจกรรมได้ที่เมนูกิจกรรมประจำชั้น' })
    });

    page.innerHTML =
      '<div class="pr-hide">' + heroHtml + '</div>' +
      docHead('รายงานสรุปงานธุรการชั้นเรียนประจำวัน', TH.dateLong(today)) +
      statsHtml + chartHtml +
      panel({ title: 'เมนูด่วน (ใช้งานบ่อย)', sub: 'เข้าถึงงานที่ใช้บ่อยภายใน 1 คลิก', icon: 'lightning-charge-fill', tone: 'warn', body: quick }) +
      '<div class="grid g-side">' + weeklyHtml + tasksHtml + '</div>' +
      '<div class="grid g-side">' + tlHtml + watchHtml + '</div>' +
      upHtml +
      docSign();
    wireQuick();
  }

  function taskRow(t) {
    return '<div class="lst-row" data-hash="' + esc(t.link || '#/') + '">' +
      '<div class="panel-ic s-' + esc(t.tone || 'mut') + '"><i class="bi bi-' + esc(t.icon) + '"></i></div>' +
      '<div class="main"><div class="t">' + esc(t.title) + '</div>' +
      '<div class="s">' + esc(t.sub || '') + '</div></div>' +
      '<div class="r">' + badge(TH.smart(t.due), t.tone === 'bad' ? 'bad' : 'warn', 'calendar-event') + '</div>' +
      '</div>';
  }

  var QUICK = [
    { hash: '#/attendance', icon: 'ui-checks', tone: 'ok', label: 'เช็กชื่อวันนี้', need: 'attendance' },
    { hash: '#/daily', icon: 'journal-plus', tone: 'info', label: 'เพิ่มบันทึกประจำวัน', need: 'daily' },
    { hash: '#/behaviors', icon: 'emoji-smile-fill', tone: 'warn', label: 'บันทึกพฤติกรรม', need: 'behavior' },
    { hash: '#/contacts', icon: 'telephone-fill', tone: 'acc', label: 'ติดต่อผู้ปกครอง', need: 'contact' },
    { hash: '#/visits', icon: 'house-heart-fill', tone: 'ok', label: 'บันทึกเยี่ยมบ้าน', need: 'visit' },
    { hash: '#/health', icon: 'clipboard2-pulse-fill', tone: 'bad', label: 'บันทึกสุขภาพ', need: 'health' },
    { hash: '#/students', icon: 'people-fill', tone: 'brand', label: 'ดูนักเรียน', need: 'any' },
    { hash: '#/reports', icon: 'printer-fill', tone: 'late', label: 'พิมพ์รายงาน', need: 'report' }
  ];

  function quickActions(can) {
    var items = QUICK.filter(function (q) {
      if (q.need === 'any') return true;
      return can[q.need] === true || (q.need === 'report' && can.report === true);
    });
    if (!items.length) items = QUICK.filter(function (q) { return q.need === 'any'; });
    return '<div class="qa-grid">' + items.map(function (q) {
      return '<div class="qa" data-hash="' + esc(q.hash) + '" role="link" tabindex="0">' +
        '<div class="qa-ic t-' + esc(q.tone) + '"><i class="bi bi-' + esc(q.icon) + '"></i></div>' +
        '<span class="lb">' + esc(q.label) + '</span>' +
        '</div>';
    }).join('') + '</div>';
  }

  function wireQuick() {
    $$('.qa').forEach(function (el) {
      el.addEventListener('click', function () {
        el.classList.add('is-busy');
        setTimeout(function () { el.classList.remove('is-busy'); }, 900);
      });
    });
  }

  /* ═══════════════════════════════════════════════════════════
     งานที่ต้องดำเนินการ
     ═══════════════════════════════════════════════════════════ */
  Routes['#/tasks'] = {
    cap: 'dashboard.view',
    render: function (page) {
      loading(page, 'list');
      call('notify.tasks', {}).then(function (d) {
        var p = guard('#/tasks');
        if (!p) return;
        var items = d.items || [];
        var over = items.filter(function (t) { return t.tone === 'bad'; }).length;
        p.innerHTML =
          hero({
            pill: 'งานประจำวัน', pillIcon: 'list-task', title: 'งานที่ต้องดำเนินการ',
            sub: 'ระบบรวบรวมงานค้างและงานที่ใกล้ครบกำหนดจากทุกโมดูลให้อัตโนมัติ',
            icon: 'list-task',
            kpis: [
              { icon: 'inboxes-fill', label: 'งานทั้งหมด', value: fmt(items.length), unit: 'รายการ' },
              { icon: 'exclamation-octagon-fill', label: 'เลยกำหนดแล้ว', value: fmt(over), unit: 'รายการ' },
              { icon: 'calendar-check-fill', label: 'ภายใน 3 วัน', value: fmt(items.length - over), unit: 'รายการ' }
            ]
          }) +
          panel({
            title: 'รายการงาน', sub: 'เรียงตามวันครบกำหนด', icon: 'card-checklist', tone: 'warn', flush: true,
            body: items.length ? '<div class="lst">' + items.map(taskRow).join('') + '</div>'
              : emptyBox({
                icon: 'check2-circle', title: 'ไม่มีงานค้าง',
                text: 'งานประจำวันของคุณเรียบร้อยทั้งหมดแล้ว',
                action: '<button class="btn btn-primary" type="button" data-hash="#/"><i class="bi bi-house-door-fill"></i> กลับหน้าหลัก</button>'
              })
          });
      }).catch(function (e) { fail('#/tasks', e); });
    }
  };

  /* ═══════════════════════════════════════════════════════════
     ภาพรวมโรงเรียน (ผู้บริหาร)
     ═══════════════════════════════════════════════════════════ */
  Routes['#/exec'] = {
    cap: 'report.view_all',
    render: function (page) {
      loading(page, 'hero');
      call('exec.dashboard', {}).then(function (d) {
        var p = guard('#/exec');
        if (!p) return;
        var k = d.kpi || {};
        var trendData = (d.trend || []).map(function (t) { return { label: TH.dayShort(t.date), value: t.rate }; });
        var prog = (d.class_progress || []).map(function (c) {
          var tone = c.score >= 80 ? 'ok' : (c.score >= 50 ? 'warn' : 'bad');
          return '<tr data-hash="#/students?cls=' + esc(c.class_id) + '" style="cursor:pointer">' +
            '<td data-l="ห้อง"><b>' + esc(c.name) + '</b></td>' +
            '<td data-l="ครูประจำชั้น">' + esc(c.homeroom) + '</td>' +
            '<td data-l="นักเรียน" class="num">' + fmt(c.students) + '</td>' +

  var STU = { q: '', class_id: '', level: '', status: '', watch_level: '', gender: '', sort: 'number', page: 1, view: 'grid' };

  Routes['#/students'] = {
    cap: 'student.view_all|student.view_own|student.view_self',
    render: function (page, q) {
      if (q && q.cls) STU.class_id = q.cls;
      if (q && q.watch) STU.watch_level = 'ต้องติดตาม';
      loading(page, 'hero');
      loadStudents(page);
    }
  };

  function loadStudents(page) {
    call('student.list', STU).then(function (d) {
      var p = guard('#/students');
      if (!p) return;
      paintStudents(p, d);
    }).catch(function (e) { fail('#/students', e); });
  }

        sub: 'ข้อมูลนักเรียนทั้งหมดที่คุณรับผิดชอบ — คลิกที่การ์ดเพื่อเปิดโปรไฟล์รายบุคคล',

          printBtn('พิมพ์รายชื่อ'),
        kpis: [
          { icon: 'people-fill', label: 'นักเรียนทั้งหมด', value: fmt(k.total), unit: 'คน' },

        ]
      }) + '</div>' +
      '<div class="toolbar no-print">' +

      '<select class="sel tb-sel" id="stu-class">' + classOpts + '</select>' +
      '<select class="sel tb-sel" id="stu-level"><option value="">ทุกระดับชั้น</option>' +
      levels.map(function (l) { return '<option value="' + esc(l) + '"' + (STU.level === l ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('') +

      '<option value="code"' + (STU.sort === 'code' ? ' selected' : '') + '>เรียงตามรหัส</option>' +
      '<option value="watch"' + (STU.sort === 'watch' ? ' selected' : '') + '>ผู้ที่ต้องติดตามก่อน</option>' +
      '</select>' +
      '<div class="chips">' +
      chip('watch', '', 'ทั้งหมด', STU.watch_level === '') +
      chip('watch', 'เฝ้าระวัง', 'เฝ้าระวัง', STU.watch_level === 'เฝ้าระวัง') +
      chip('watch', 'ต้องติดตาม', 'ต้องติดตาม', STU.watch_level === 'ต้องติดตาม') +
      chip('watch', 'ต้องช่วยเหลือ', 'ต้องช่วยเหลือ', STU.watch_level === 'ต้องช่วยเหลือ') +
      '</div>' +
      '<div class="view-toggle">' +
      '<button type="button" data-view="grid" class="' + (STU.view === 'grid' ? 'is-on' : '') + '" title="มุมมองการ์ด"><i class="bi bi-grid-3x2-gap-fill"></i></button>' +
      '<button type="button" data-view="list" class="' + (STU.view === 'list' ? 'is-on' : '') + '" title="มุมมองตาราง"><i class="bi bi-list-ul"></i></button>' +
      '</div>' +
      '<button class="btn btn-ghost btn-sm" type="button" id="stu-clear"><i class="bi bi-x-circle"></i> ล้างตัวกรอง</button>' +
      '</div>' +
      docHead('บัญชีรายชื่อนักเรียน', filterSummary()) +
      (d.total ? (STU.view === 'grid'
        ? '<div class="grid g-auto sd-stagger no-print">' + cards + '</div>' +
        '<div class="pr-only"><table class="prtable"><colgroup><col style="width:8%"><col style="width:14%">' +
        '<col style="width:30%"><col style="width:14%"><col style="width:10%"><col style="width:10%"><col style="width:14%"></colgroup>' +

        (d.items || []).map(function (s) {
          return '<tr><td class="n">' + esc(s.number) + '</td><td class="n">' + esc(s.student_code) + '</td>' +

        : panel({
          body: emptyBox({
            icon: 'person-x', title: 'ไม่พบนักเรียนตามเงื่อนไข',
            text: 'ลองล้างตัวกรอง หรือเพิ่มนักเรียนใหม่เข้าสู่ระบบ',
            action: can.manage ? '<button class="btn btn-primary" type="button" id="stu-add2"><i class="bi bi-person-plus-fill"></i> เพิ่มนักเรียน</button>' : ''

        })) +
      '<div class="no-print">' + pager({ page: d.page, pages: d.pages, total: d.total }) + '</div>' +
      docSign();

  function filterSummary() {
    var parts = [];
    if (Store.year) parts.push(Store.year.label);
    if (STU.class_id) {
      var c = (Store.classes || []).filter(function (x) { return x.id === STU.class_id; })[0];
      parts.push('ห้อง ' + (c ? c.name : STU.class_id));
    } else parts.push('ทุกห้องที่รับผิดชอบ');
    if (STU.level) parts.push('ระดับชั้น ' + STU.level);
    if (STU.watch_level) parts.push('ระดับติดตาม: ' + STU.watch_level);
    if (STU.q) parts.push('คำค้น "' + STU.q + '"');
    return parts.join(' · ');
  }

  function chip(group, value, label, on) {
    return '<button class="chip' + (on ? ' is-on' : '') + '" type="button" data-chip="' + esc(group) +
      '" data-val="' + esc(value) + '">' + esc(label) + '</button>';
  }

  function wireStudents(d) {
    var q = $('#stu-q');
    if (q) q.addEventListener('input', A.debounce(function () { STU.q = q.value; STU.page = 1; loadStudents($('#page')); }, 300));
    var cl = $('#stu-class');
    if (cl) cl.addEventListener('change', function () { STU.class_id = cl.value; STU.page = 1; loadStudents($('#page')); });
    var lv = $('#stu-level');
    if (lv) lv.addEventListener('change', function () { STU.level = lv.value; STU.page = 1; loadStudents($('#page')); });
    var so = $('#stu-sort');
    if (so) so.addEventListener('change', function () { STU.sort = so.value; loadStudents($('#page')); });
    $$('[data-chip="watch"]').forEach(function (b) {
      b.addEventListener('click', function () { STU.watch_level = b.getAttribute('data-val'); STU.page = 1; loadStudents($('#page')); });
    });
    $$('[data-view]').forEach(function (b) {
      b.addEventListener('click', function () { STU.view = b.getAttribute('data-view'); loadStudents($('#page')); });
    });
    var cls = $('#stu-clear');
    if (cls) cls.addEventListener('click', function () {
      STU.q = ''; STU.class_id = ''; STU.level = ''; STU.watch_level = ''; STU.gender = ''; STU.page = 1;
      loadStudents($('#page'));
    });
    $$('.pager button').forEach(function (b) {
      b.addEventListener('click', function () { STU.page = num(b.getAttribute('data-page'), 1); loadStudents($('#page')); });
    });
    ['#stu-add', '#stu-add2'].forEach(function (sel) {
      var el = $(sel);
      if (el) el.addEventListener('click', function () { openStudentForm(''); });
    });
    $$('[data-stu-edit]').forEach(function (b) {
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        openStudentForm(b.getAttribute('data-stu-edit'));
      });
    });
  }

          fieldTxt('phone', 'โทรศัพท์', s.phone, false, 'tel') +

          fieldSel('watch_level', 'ระดับการดูแล', ['ทั่วไป', 'เฝ้าระวัง', 'ต้องติดตาม', 'ต้องช่วยเหลือ', 'ส่งต่อ'], s.watch_level, false) +
          fieldSel('travel_mode', 'การเดินทางมาโรงเรียน', ['เดินเท้า', 'จักรยาน', 'รถจักรยานยนต์', 'รถรับส่งนักเรียน', 'ผู้ปกครองรับส่ง', 'รถโดยสารประจำทาง'], s.travel_mode, false) +
          fieldTxt('distance_km', 'ระยะทางจากบ้าน (กม.)', s.distance_km, false, 'number') +
          fieldTxt('disadvantage', 'ความด้อยโอกาส (ถ้ามี)', s.disadvantage, false, 'text') +
          '<div class="field full"><label>ที่อยู่</label>' +
          '<textarea class="txt" data-f="address" rows="2" placeholder="บ้านเลขที่ หมู่ ตำบล อำเภอ จังหวัด">' + esc(s.address) + '</textarea></div>' +
          '<div class="field full"><label>หมายเหตุ</label>' +
          '<textarea class="txt" data-f="note" rows="2" placeholder="ข้อมูลเพิ่มเติมที่ครูควรทราบ">' + esc(s.note) + '</textarea></div>' +
          '</div>' +
          '<input type="hidden" data-f="id" value="' + esc(s.id || '') + '">' +
          '<input type="hidden" data-f="rev" value="' + esc(s.rev || '') + '">' +
          '</form>',
        footer:
          '<button class="btn btn-ghost" type="button" data-close="1"><i class="bi bi-x-lg"></i> ยกเลิก</button>' +
          '<button class="btn btn-primary" type="button" id="stu-save" data-state="idle">' +
          buttonStates('บันทึกข้อมูล', 'check-lg') + '</button>',
        onOpen: function (host) {
          var sel = $('[data-f="class_id"]', host);
          if (sel) sel.value = s.class_id || '';
          var file = $('#stu-photo', host);
          if (file) {
            file.addEventListener('change', function () { previewPhoto(file, '#pv-photo'); });
          }
          var save = $('#stu-save', host);
          if (save) save.addEventListener('click', function () { submitStudent(save, host); });
        }
      });
    };

    if (!id) { done({ id: '', prefix: 'เด็กชาย', status: 'กำลังศึกษา', watch_level: 'ทั่วไป', class_id: STU.class_id }, []); return; }
    A.spinShow('กำลังโหลดข้อมูลนักเรียน', { stages: ['กำลังดึงข้อมูลเต็มจากฐานข้อมูล…', 'กำลังเตรียมแบบฟอร์ม…'] });
    call('student.get', { id: id }).then(function (d) {
      A.spinHide();
      done(d.student || {}, d.parents || []);
    }).catch(function (e) { A.spinHide(); toast(e.message, 'bad'); });
  }

  function fieldTxt(key, label, value, req, type) {
    var t = type || 'text';
    var inputmode = t === 'number' ? ' inputmode="decimal"' : (t === 'tel' ? ' inputmode="tel"' : '');
    return '<div class="field"><label>' + esc(label) + (req ? '<span class="req">*</span>' : '') + '</label>' +
      '<input class="inp" type="' + esc(t) + '"' + inputmode + ' data-f="' + esc(key) + '" value="' + esc(value === undefined || value === null ? '' : value) + '"' +
      (req ? ' required' : '') + '></div>';
  }

  function fieldSel(key, label, options, value, req) {
    var opts = (req ? '' : '<option value="">— ไม่ระบุ —</option>') + options.map(function (o) {
      return '<option value="' + esc(o) + '"' + (String(value || '') === o ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('');
    return '<div class="field"><label>' + esc(label) + (req ? '<span class="req">*</span>' : '') + '</label>' +
      '<select class="sel" data-f="' + esc(key) + '"' + (req ? ' required' : '') + '>' + opts + '</select></div>';
  }

  function previewPhoto(input, previewSel) {
    var f = input.files && input.files[0];
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) { toast('ไฟล์ใหญ่เกิน 8 MB', 'bad'); input.value = ''; return; }
    var r = new FileReader();
    r.onload = function () {
      var pv = $(previewSel);
      if (pv) pv.innerHTML = '<img src="' + r.result + '" alt="ตัวอย่างรูป">';
      input.dataset.url = r.result;
    };
    r.readAsDataURL(f);
  }

  function readForm(root) {
    var out = {};
    $$('[data-f]', root).forEach(function (el) {
      var k = el.getAttribute('data-f');
      out[k] = el.type === 'checkbox' ? el.checked : el.value;
    });
    return out;
  }

  function submitStudent(btn, host) {
    var data = readForm(host);
    if (!String(data.first_name || '').trim()) { toast('กรุณากรอกชื่อนักเรียน', 'warn'); return; }
    if (!String(data.last_name || '').trim()) { toast('กรุณากรอกนามสกุลนักเรียน', 'warn'); return; }
    if (!String(data.class_id || '').trim()) { toast('กรุณาเลือกห้องเรียน', 'warn'); return; }
    var file = $('#stu-photo', host);
    if (file && file.dataset.url) data.photo_data = file.dataset.url;
    runAction(btn, {}, function () {
      return call('student.save', data).then(function () {
        modalClose();
        toast(data.id ? 'แก้ไขข้อมูลนักเรียนเรียบร้อย' : 'เพิ่มนักเรียนใหม่เรียบร้อย', 'ok', 'บันทึกสำเร็จ');
        Store.home = null;
        loadStudents($('#page'));
      });
    });
  }

  /* ═══════════════════════════════════════════════════════════
     โปรไฟล์นักเรียนรายบุคคล
     ═══════════════════════════════════════════════════════════ */
  var PF_TAB = 'info';

  Routes['#/student'] = {
    cap: 'student.view_all|student.view_own|student.view_self',
    render: function (page, q) {
      var id = (q && q.id) || '';
      if (!id) { A.navigate('#/students'); return; }
      loading(page, 'hero');
      call('student.profile', { id: id }).then(function (d) {
        var p = guard('#/student');
        if (!p) return;
        paintProfile(p, d);
      }).catch(function (e) { fail('#/student', e); });
    }
  };

      { k: 'attendance', label: 'การมาเรียน', icon: 'ui-checks', n: (d.attendance || []).length },
      { k: 'behavior', label: 'พฤติกรรม', icon: 'emoji-smile-fill', n: (d.behaviors || []).length },
      { k: 'health', label: 'สุขภาพ', icon: 'clipboard2-pulse-fill', n: (d.health || []).length },
      { k: 'visit', label: 'เยี่ยมบ้าน', icon: 'house-heart-fill', n: (d.visits || []).length },
      { k: 'contact', label: 'ติดต่อผู้ปกครอง', icon: 'telephone-fill', n: (d.contacts || []).length },
      { k: 'case', label: 'การติดตาม', icon: 'life-preserver', n: (d.cases || []).length },
      { k: 'activity', label: 'กิจกรรม', icon: 'flag-fill', n: (d.activities || []).length },
      { k: 'work', label: 'การส่งงาน', icon: 'journal-check', n: (d.submissions || []).length },
      { k: 'doc', label: 'เอกสาร', icon: 'folder-fill', n: (d.documents || []).length },

    page.innerHTML =

      '<div class="pf-row">' +
      '<div class="pf-photo">' + (s.photo_url
        ? '<img src="' + esc(s.photo_url) + '" alt="รูปนักเรียน" referrerpolicy="no-referrer">'
        : esc(A.initials(s.full_name))) + '</div>' +
      '<div class="pf-info">' +
      '<div class="pf-name">' + esc(s.full_name) + (s.nickname ? ' <span style="font-size:15px;opacity:.8">(' + esc(s.nickname) + ')</span>' : '') + '</div>' +
      '<div class="pf-meta">' +
      '<span class="pf-tag"><i class="bi bi-upc-scan"></i> ' + esc(s.student_code) + '</span>' +
      '<span class="pf-tag"><i class="bi bi-door-open-fill"></i> ' + esc(s.class_name) + ' เลขที่ ' + esc(s.number || '-') + '</span>' +
      '<span class="pf-tag"><i class="bi bi-gender-' + (s.gender === 'ชาย' ? 'male' : 'female') + '"></i> ' + esc(s.gender) + '</span>' +
      (s.age ? '<span class="pf-tag"><i class="bi bi-cake2"></i> ' + s.age + ' ปี</span>' : '') +
      (s.blood_group ? '<span class="pf-tag"><i class="bi bi-droplet-fill"></i> กรุ๊ป ' + esc(s.blood_group) + '</span>' : '') +
      (s.watch_level !== 'ทั่วไป' ? '<span class="pf-tag" style="background:rgba(244,63,94,.32)"><i class="bi bi-exclamation-triangle-fill"></i> ' + esc(s.watch_level) + '</span>' : '') +
      '</div>' +
      '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      (can.manage ? '<button class="btn btn-glass" type="button" id="pf-edit"><i class="bi bi-pencil-fill"></i> แก้ไขข้อมูล</button>' : '') +
      printBtn('พิมพ์ประวัติ') +
      (can.manage ? '<button class="btn btn-glass btn-icon" type="button" id="pf-del" title="ลบนักเรียน"><i class="bi bi-trash-fill"></i></button>' : '') +
      '</div>' +
      '</div>' +
      '<div class="pf-stats">' +
      pfStat('อัตราการมาเรียน', num(sum.attendance_rate, 0) + '%', 'ui-checks') +
      pfStat('ขาดเรียน', fmt((sum.attendance || {}).absent) + ' ครั้ง', 'x-circle-fill') +
      pfStat('มาสาย', fmt((sum.attendance || {}).late) + ' ครั้ง', 'clock-fill') +
      pfStat('คะแนนพฤติกรรม', (num(sum.behavior_point, 0) > 0 ? '+' : '') + fmt(sum.behavior_point), 'emoji-smile-fill') +
      pfStat('เยี่ยมบ้าน', fmt(sum.visit_count) + ' ครั้ง', 'house-heart-fill') +
      pfStat('เคสที่ยังไม่ปิด', fmt(sum.case_open) + ' เคส', 'life-preserver') +
      '</div>' +
      '</div>' +
      docHead('ประวัตินักเรียนรายบุคคล', s.full_name + ' · ' + s.class_name + ' · ' + ((Store.year && Store.year.label) || '')) +
      tabsHtml +
      '<div id="pf-body">' + profileTab(PF_TAB, d) + '</div>' +
      docSign([
        { role: 'ครูประจำชั้น', name: s.homeroom_name || (Store.user || {}).full_name || '' },
        { role: (Store.settings || {}).director_position || 'ผู้อำนวยการโรงเรียน', name: (Store.settings || {}).director_name || '' }
      ]);

    $$('[data-tab]').forEach(function (b) {
      b.addEventListener('click', function () {
        PF_TAB = b.getAttribute('data-tab');
        $$('[data-tab]').forEach(function (x) { x.classList.toggle('is-on', x === b); });
        var body = $('#pf-body');
        if (body) body.innerHTML = profileTab(PF_TAB, d);
      });
    });
    var ed = $('#pf-edit');
    if (ed) ed.addEventListener('click', function () { openStudentForm(s.id); });
    var del = $('#pf-del');

  function pfStat(label, value, icon) {
    return '<div class="mh-stat"><div class="l"><i class="bi bi-' + esc(icon) + '"></i> ' + esc(label) + '</div>' +
      '<div class="v">' + esc(value) + '</div></div>';
  }

  function confirmDeleteStudent(s) {
    confirmBox({
      title: 'ยืนยันการลบนักเรียน',
      subtitle: 'การลบนี้ย้อนกลับไม่ได้',
      html: '<p>ระบบจะลบ <b>' + esc(s.full_name) + '</b> พร้อมข้อมูลที่เกี่ยวข้องทั้งหมด ได้แก่ ' +
        'ผู้ปกครอง การมาเรียน พฤติกรรม การติดต่อ เยี่ยมบ้าน สุขภาพ เคสติดตาม และการส่งงาน</p>' +
        '<p style="color:var(--bad)"><i class="bi bi-exclamation-triangle-fill"></i> ' +
        'แนะนำให้สำรองข้อมูลก่อน (ไฟล์ → ทำสำเนา ในสเปรดชีต)</p>',
      okText: 'ลบนักเรียนคนนี้', okIcon: 'trash-fill'
    }).then(function (yes) {
      if (!yes) return;
      A.spinShow('กำลังลบข้อมูล', { stages: ['กำลังลบข้อมูลที่เกี่ยวข้อง…', 'กำลังลบทะเบียนนักเรียน…'] });
      call('student.delete', { id: s.id }).then(function () {
        A.spinHide();
        Store.home = null;
        toast('ลบข้อมูลนักเรียนเรียบร้อย', 'ok');
        A.navigate('#/students');
      }).catch(function (e) { A.spinHide(); toast(e.message, 'bad'); });
    });
  }

        title: 'ข้อมูลพื้นฐาน', icon: 'person-lines-fill', tone: 'brand',
        body: '<dl class="dl">' +
          dlRow('รหัสนักเรียน', s.student_code) + dlRow('เลขประจำตัวประชาชน', s.citizen_id) +

          dlRow('เพศ', s.gender) + dlRow('วันเกิด', TH.dateLong(s.birthdate)) +

          dlRow('ความด้อยโอกาส', s.disadvantage) + dlRow('การเดินทาง', s.travel_mode) +

          dlRow('โทรศัพท์', s.phone) + dlRow('อีเมล', s.email) +

          (s.address ? '<div class="sec" style="margin-top:16px"><div class="sec-t"><i class="bi bi-geo-alt-fill"></i> ที่อยู่</div>' +

          dlRow('อาชีพ', p.occupation) + dlRow('รายได้/เดือน', p.income ? fmt(p.income) + ' บาท' : '—') +

      });

  function bmiTone(level) {

  function attMark(status) {

      'มา': { cls: 'mk-present', ch: '/' }, 'ขาด': { cls: 'mk-absent', ch: 'x' },
      'ลาป่วย': { cls: 'mk-sick', ch: 'ป' }, 'ลากิจ': { cls: 'mk-leave', ch: 'ก' },
      'มาสาย': { cls: 'mk-late', ch: 'ส' }, 'กิจกรรม': { cls: 'mk-event', ch: '+' }
    };
    return m[status] || { cls: 'mk-other', ch: '-' };

  function listPanel(title, icon, tone, items, emptyText) {

        (it.sub ? '<div class="tl-d">' + esc(it.sub) + '</div>' : '') +
        (it.detail ? '<div class="tl-d">' + esc(it.detail) + '</div>' : '') +
        (it.extra ? '<div class="tl-d" style="color:var(--ink-3)">' + esc(it.extra) + '</div>' : '') +

  function wireParents(d) {
    var s = d.student || {};
    var open = function (p) {
      modal({
        title: p && p.id ? 'แก้ไขข้อมูลผู้ปกครอง' : 'เพิ่มผู้ปกครอง',
        icon: 'people-fill', tone: 'info',
        body: '<form id="par-form"><div class="form-grid">' +
          fieldSel('prefix', 'คำนำหน้า', ['นาย', 'นาง', 'นางสาว'], p.prefix, false) +
          fieldTxt('full_name', 'ชื่อ-นามสกุล', p.full_name, true, 'text') +
          fieldSel('relation', 'ความสัมพันธ์', ['บิดา', 'มารดา', 'ปู่/ย่า', 'ตา/ยาย', 'ลุง/ป้า/น้า/อา', 'ผู้ปกครอง'], p.relation, false) +
          fieldTxt('phone', 'โทรศัพท์', p.phone, false, 'tel') +
          fieldTxt('line_id', 'LINE ID', p.line_id, false, 'text') +
          fieldTxt('occupation', 'อาชีพ', p.occupation, false, 'text') +
          fieldTxt('income', 'รายได้ต่อเดือน (บาท)', p.income, false, 'number') +
          fieldTxt('workplace', 'สถานที่ทำงาน', p.workplace, false, 'text') +
          '<div class="field full"><label class="switch"><input type="checkbox" data-f="is_primary"' +
          (p.is_primary ? ' checked' : '') + '><span class="track"></span><span class="lb">เป็นผู้ปกครองหลัก (ใช้ติดต่อเป็นอันดับแรก)</span></label></div>' +
          '<div class="field full"><label>ที่อยู่</label><textarea class="txt" data-f="address" rows="2">' + esc(p.address || '') + '</textarea></div>' +
          '</div>' +
          '<input type="hidden" data-f="id" value="' + esc(p.id || '') + '">' +
          '<input type="hidden" data-f="rev" value="' + esc(p.rev || '') + '">' +
          '<input type="hidden" data-f="student_id" value="' + esc(s.id) + '"></form>',
        footer: '<button class="btn btn-ghost" type="button" data-close="1"><i class="bi bi-x-lg"></i> ยกเลิก</button>' +
          '<button class="btn btn-primary" type="button" id="par-save" data-state="idle">' + buttonStates('บันทึก', 'check-lg') + '</button>',
        onOpen: function (host) {
          var sv = $('#par-save', host);
          if (!sv) return;
          sv.addEventListener('click', function () {
            var data = readForm(host);
            if (!String(data.full_name || '').trim()) { toast('กรุณากรอกชื่อผู้ปกครอง', 'warn'); return; }
            runAction(sv, {}, function () {
              return call('parent.save', data).then(function () {
                modalClose();
                toast('บันทึกข้อมูลผู้ปกครองเรียบร้อย', 'ok');
                A.dispatch();
              });
            });
          });
        }
      });
    };
    ['#par-add', '#par-add2'].forEach(function (sel) {
      var el = $(sel);
      if (el) el.addEventListener('click', function () { open({}); });
    });
    $$('[data-par-edit]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-par-edit');
        var p = (d.parents || []).filter(function (x) { return x.id === id; })[0];
        if (p) open(p);
      });
    });
    $$('[data-par-del]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-par-del');
        confirmBox({ title: 'ลบข้อมูลผู้ปกครอง', text: 'ต้องการลบข้อมูลผู้ปกครองรายนี้ใช่หรือไม่', okText: 'ลบ' }).then(function (yes) {
          if (!yes) return;
          call('parent.delete', { id: id }).then(function () {
            toast('ลบข้อมูลผู้ปกครองเรียบร้อย', 'ok');
            A.dispatch();
          }).catch(function (e) { toast(e.message, 'bad'); });
        });
      });
    });
  }

      hero({

        sub: 'นำเข้าจากไฟล์ CSV ได้ครั้งละหลายร้อยรายการ ระบบตรวจสอบข้อมูลให้ก่อนบันทึกจริง',
        icon: 'arrow-left-right',
        actions: (hasCap('student.export') ? '<button class="btn btn-glass" type="button" id="imp-export">' +
          '<i class="bi bi-file-earmark-excel-fill"></i> ส่งออกรายชื่อ (CSV)</button>' : '') +
          '<button class="btn btn-glass" type="button" id="imp-tpl"><i class="bi bi-download"></i> ดาวน์โหลดแม่แบบ</button>'
      }) +
      '<div class="grid g-side">' +
      panel({
        title: 'อัปโหลดไฟล์ข้อมูล', sub: 'รองรับไฟล์ .csv ที่บันทึกด้วยรหัสอักขระ UTF-8', icon: 'cloud-upload-fill', tone: 'brand',
        body: '<div class="upload" style="flex-direction:column;align-items:stretch;text-align:center;padding:26px">' +
          '<div style="font-size:38px;color:var(--c10)"><i class="bi bi-filetype-csv"></i></div>' +
          '<div style="font-weight:600;margin-top:8px">เลือกไฟล์ CSV ที่กรอกข้อมูลแล้ว</div>' +
          '<div style="font-size:12px;color:var(--ink-3);margin-top:3px">ระบบจะตรวจสอบข้อมูลให้ก่อน ยังไม่บันทึกลงฐานข้อมูลทันที</div>' +
          '<label class="btn btn-primary" style="margin:14px auto 0;max-width:220px"><i class="bi bi-folder2-open"></i> เลือกไฟล์' +
          '<input type="file" id="imp-file" accept=".csv,text/csv"></label>' +
          '</div>' +
          '<div id="imp-result" style="margin-top:16px"></div>'
      }) +
      panel({ title: 'ขั้นตอนการนำเข้า', icon: 'list-ol', tone: 'info', flush: true, body: '<div class="lst">' + steps + '</div>' }) +
      '</div>' +
      panel({
        title: 'คอลัมน์ที่ระบบรองรับ', sub: 'เรียงลำดับตามนี้ในไฟล์ CSV', icon: 'table', tone: 'warn',
        body: '<div class="chips">' + (t.columns || []).map(function (c, i) {
          return '<span class="chip" style="cursor:default">' + (i + 1) + '. ' + esc(c) + '</span>';
        }).join('') + '</div>' +
          '<div style="margin-top:14px;font-size:12.5px;color:var(--ink-2);line-height:1.8">' +
          '<i class="bi bi-info-circle-fill" style="color:var(--c10)"></i> ' +
          'ช่องที่เว้นว่างไว้ในไฟล์ ระบบจะ<b>ไม่แตะข้อมูลเดิม</b> (ไม่ล้างค่าที่ครูกรอกไว้แล้ว) · ' +
          'แถวที่มีรหัสนักเรียนตรงกับที่มีอยู่จะเป็นการ<b>อัปเดต</b> ไม่ใช่สร้างซ้ำ</div>'
      });

    var tplBtn = $('#imp-tpl');
    if (tplBtn) tplBtn.addEventListener('click', function () { downloadCSV('แม่แบบนำเข้านักเรียน', t.columns, t.sample || []); });
    var expBtn = $('#imp-export');
    if (expBtn) {
      expBtn.addEventListener('click', function () {
        A.spinShow('กำลังเตรียมไฟล์ส่งออก', { stages: ['กำลังรวบรวมข้อมูลนักเรียน…', 'กำลังจัดรูปแบบไฟล์…'] });
        call('student.export', { class_id: STU.class_id }).then(function (d) {
          A.spinHide();
          downloadCSV(d.title || 'รายชื่อนักเรียน', d.head, d.rows);
          toast('ส่งออก ' + fmt((d.rows || []).length) + ' รายการเรียบร้อย', 'ok');
        }).catch(function (e) { A.spinHide(); toast(e.message, 'bad'); });
      });
    }
    var file = $('#imp-file');
    if (file) file.addEventListener('change', function () { readCsvFile(file); });
  }

  function downloadCSV(name, head, rows) {
    var lines = [head].concat(rows || []).map(function (r) {
      return (r || []).map(function (c) {
        var s = String(c === undefined || c === null ? '' : c);
        return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
    var blob = new Blob(['﻿' + lines], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = name + '_' + TH.iso(new Date()) + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
  }

  function parseCSV(text) {
    var rows = [], row = [], cur = '', q = false;
    var t = String(text).replace(/^﻿/, '');
    for (var i = 0; i < t.length; i++) {
      var c = t[i];
      if (q) {
        if (c === '"') {
          if (t[i + 1] === '"') { cur += '"'; i++; } else q = false;
        } else cur += c;
      } else if (c === '"') q = true;
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (c !== '\r') cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.join('').trim() !== ''; });
  }

  function readCsvFile(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    if (f.size > 4 * 1024 * 1024) { toast('ไฟล์ใหญ่เกิน 4 MB', 'bad'); input.value = ''; return; }
    var r = new FileReader();
    r.onload = function () {
      IMP.rows = parseCSV(r.result);
      if (!IMP.rows.length) { toast('ไม่พบข้อมูลในไฟล์', 'warn'); return; }
      A.spinShow('กำลังตรวจสอบข้อมูล', { stages: ['กำลังอ่านไฟล์…', 'กำลังตรวจสอบความถูกต้อง…', 'กำลังเทียบกับข้อมูลเดิม…'] });
      call('student.preview', { rows: IMP.rows, has_header: true }).then(function (d) {
        A.spinHide();
        IMP.preview = d;
        paintImportResult(d);
      }).catch(function (e) { A.spinHide(); toast(e.message, 'bad'); });
    };
    r.readAsText(f, 'UTF-8');
  }

  function paintImportResult(d) {
    var box = $('#imp-result');
    if (!box) return;
    var s = d.summary || {};
    var errs = (d.errors || []).map(function (e) {
      return '<tr><td data-l="แถว" class="ctr">' + e.row + '</td>' +
        '<td data-l="ชื่อ">' + esc((e.data.first_name || '') + ' ' + (e.data.last_name || '')) + '</td>' +
        '<td data-l="ปัญหา" style="color:var(--bad)">' + esc(e.messages.join(' · ')) + '</td></tr>';
    }).join('');
    box.innerHTML =
      '<div class="grid g-3 sd-stagger" style="margin-bottom:14px">' +
      statCard({ icon: 'person-plus-fill', tone: 'ok', label: 'จะเพิ่มใหม่', value: fmt(s.create), unit: 'คน' }) +
      statCard({ icon: 'pencil-square', tone: 'info', label: 'จะอัปเดต', value: fmt(s.update), unit: 'คน' }) +
      statCard({ icon: 'exclamation-octagon-fill', tone: 'bad', label: 'ผิดพลาด', value: fmt(s.error), unit: 'แถว' }) +
      '</div>' +
      (errs ? '<div class="sec"><div class="sec-t"><i class="bi bi-bug-fill"></i> รายการที่ต้องแก้ไข</div>' +
        '<div class="tbl-wrap"><table class="tbl tbl-resp tbl-mini"><thead><tr><th class="ctr">แถว</th><th>ชื่อ</th><th>ปัญหา</th></tr></thead>' +
        '<tbody>' + errs + '</tbody></table></div></div>' : '') +
      '<div class="row is-end" style="margin-top:14px">' +
      '<button class="btn btn-ghost" type="button" id="imp-cancel"><i class="bi bi-x-lg"></i> ยกเลิก</button>' +
      '<button class="btn btn-primary" type="button" id="imp-commit" data-state="idle"' +
      (num(s.create, 0) + num(s.update, 0) === 0 ? ' disabled' : '') + '>' +
      buttonStates('ยืนยันนำเข้า ' + fmt(num(s.create, 0) + num(s.update, 0)) + ' รายการ', 'cloud-arrow-up-fill') + '</button>' +
      '</div>';

    var cancel = $('#imp-cancel');
    if (cancel) cancel.addEventListener('click', function () { box.innerHTML = ''; IMP.rows = []; IMP.preview = null; });
    var commit = $('#imp-commit');
    if (commit) {
      commit.addEventListener('click', function () {
        runAction(commit, {}, function () {
          return call('student.commit', { rows: IMP.rows, has_header: true }).then(function (r) {
            var sm = r.summary || {};
            Store.home = null;
            toast('เพิ่มใหม่ ' + sm.created + ' คน · อัปเดต ' + sm.updated + ' คน · ผู้ปกครอง ' + sm.parents + ' รายการ',
              'ok', 'นำเข้าข้อมูลสำเร็จ');
            box.innerHTML = '<div class="empty"><div class="empty-ic s-ok"><i class="bi bi-check-circle-fill"></i></div>' +
              '<div class="t">นำเข้าข้อมูลเรียบร้อย</div>' +
              '<div class="d">เพิ่มใหม่ ' + sm.created + ' คน · อัปเดต ' + sm.updated + ' คน</div>' +
              '<button class="btn btn-primary" type="button" data-hash="#/students">' +
              '<i class="bi bi-people-fill"></i> ไปที่ทะเบียนนักเรียน</button></div>';
          });
        });
      });
    }
  }

  /* ═══════════════════════════════════════════════════════════
     เมนูทั้งหมด (สำหรับมือถือ)
     ═══════════════════════════════════════════════════════════ */
  Routes['#/menu'] = {
    cap: 'dashboard.view',

          body: '<div class="app-grid">' + items.map(function (it) {

              '<div class="app-ic t-brand"><i class="bi bi-' + esc(it.icon) + '"></i></div>' +
              '<span class="lb">' + esc(it.label) + '</span></div>';
          }).join('') + '</div>'
        });
      }).join('');
      page.innerHTML =
        hero({
          pill: (Store.user || {}).role_label || '', pillIcon: 'person-badge-fill', title: 'เมนูทั้งหมด',
          sub: 'ทุกส่วนของระบบที่บทบาทของคุณเข้าถึงได้', icon: 'grid-3x3-gap-fill'
        }) + groups;
    }
  };

  /* ล้างตัวกรองของหน้าเมื่อเปลี่ยนบัญชีผู้ใช้ */
  A.RESETTERS.push(function () {
    STU.q = ''; STU.class_id = ''; STU.level = ''; STU.status = '';
    STU.watch_level = ''; STU.gender = ''; STU.sort = 'number'; STU.page = 1; STU.view = 'grid';
    PF_TAB = 'info';
    IMP.rows = []; IMP.preview = null;
  });

  /* พื้นผิวที่ไฟล์หน้าจออื่นเรียกใช้ */
  A.guard = guard;
  A.loading = loading;
  A.failPage = fail;
  A.docHead = docHead;
  A.docSign = docSign;
  A.printBtn = printBtn;
  A.fieldTxt = fieldTxt;
  A.fieldSel = fieldSel;
  A.readForm = readForm;
  A.previewPhoto = previewPhoto;
  A.dlRow = dlRow;
  A.attMark = attMark;
  A.bmiTone = bmiTone;
  A.listPanel = listPanel;
  A.chip = chip;
  A.downloadCSV = downloadCSV;
  A.taskRow = taskRow;
})(window);
</script>

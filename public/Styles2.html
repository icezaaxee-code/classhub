<style>
/* ═══════════════════════════════════════════════════════════════
   17) ตาราง — บนมือถือแปลงเป็นการ์ดเสมอ (ห้าม scroll แนวนอนเป็นค่าเริ่มต้น)
   ═══════════════════════════════════════════════════════════════ */
.tbl-wrap{overflow-x:auto;border-radius:var(--r-m)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl thead th{
  position:sticky;top:0;z-index:1;background:var(--c60-sink);color:var(--ink-2);
  font-family:var(--f-display);font-weight:600;font-size:12.5px;text-align:left;
  padding:11px 13px;border-bottom:1px solid var(--line);white-space:nowrap;
}
.tbl tbody td{padding:11px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{transition:background .14s var(--ease)}
.tbl tbody tr:hover{background:var(--c30-soft)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .ctr{text-align:center}
.tbl .act{white-space:nowrap;text-align:right}
.tbl .nowrap{white-space:nowrap}
.tbl-mini thead th,.tbl-mini tbody td{padding:8px 10px;font-size:12.5px}

/* ── การ์ดรายการ (ใช้แทนตารางเป็นค่าเริ่มต้น) ───────────────── */
.item-card{
  position:relative;background:var(--c60-raise);border:1px solid var(--line);border-radius:var(--r-l);
  padding:16px;box-shadow:var(--sh-1);cursor:pointer;overflow:hidden;
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s var(--ease);
}
.item-card:hover{transform:translateY(-3px);box-shadow:var(--sh-3);border-color:var(--c10-ring)}
.item-card.is-alert{border-left:4px solid var(--bad)}
.item-card.is-warn{border-left:4px solid var(--warn)}
.item-card.is-ok{border-left:4px solid var(--ok)}
.ic-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:11px}
.ic-head .who{flex:1;min-width:0}
.ic-name{font-family:var(--f-display);font-weight:600;font-size:14.5px;line-height:1.3;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic-sub{font-size:11.5px;color:var(--ink-3);line-height:1.45}
.ic-body{font-size:13px;color:var(--ink-2);line-height:1.65}
.ic-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11.5px;color:var(--ink-3);margin-top:9px}
.ic-meta span{display:inline-flex;align-items:center;gap:4px}
.ic-foot{display:flex;align-items:center;gap:7px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
.ic-foot .sp{flex:1}
.ic-corner{position:absolute;top:12px;right:12px}

/* ── รายการเรียงเป็นบรรทัด ──────────────────────────────────── */
.lst{display:flex;flex-direction:column}
.lst-row{
  display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .14s var(--ease);
}
.lst-row:last-child{border-bottom:0}
.lst-row:hover{background:var(--c30-soft)}
.lst-row .main{flex:1;min-width:0}
.lst-row .t{font-size:13.5px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lst-row .s{font-size:11.5px;color:var(--ink-3);line-height:1.45}
.lst-row .r{text-align:right;white-space:nowrap}

/* ═══════════════════════════════════════════════════════════════
   18) ไทม์ไลน์
   ═══════════════════════════════════════════════════════════════ */
.tl{position:relative;padding-left:30px}
.tl::before{content:'';position:absolute;left:14px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-item{position:relative;padding-bottom:17px}
.tl-item:last-child{padding-bottom:0}
.tl-ic{
  position:absolute;left:-30px;top:0;width:29px;height:29px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;color:#fff;
  box-shadow:0 0 0 3px var(--c60-raise);
}
.tl-t{font-size:13.5px;font-weight:600;line-height:1.4}
.tl-d{font-size:12.5px;color:var(--ink-2);line-height:1.6}
.tl-w{font-size:11px;color:var(--ink-3);margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* ═══════════════════════════════════════════════════════════════
   19) กราฟ SVG (เขียนเอง — ไม่มีไลบรารีภายนอก)
   ═══════════════════════════════════════════════════════════════ */
.chart{width:100%;overflow:visible}
.chart .grid-l{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
.chart .axis-t{fill:var(--ink-3);font-size:10.5px;font-family:var(--f-body)}
.chart .line-m{fill:none;stroke:var(--c10);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chart .line-s{fill:none;stroke:var(--acc);stroke-width:2;stroke-dasharray:5 4;stroke-linecap:round}
.chart .dot{fill:var(--c60-raise);stroke:var(--c10);stroke-width:2.4}
.chart .dot-l{fill:var(--ink-2);font-size:10px;text-anchor:middle;font-family:var(--f-body)}
.chart .bar{transition:opacity .18s var(--ease)}
.chart .bar:hover{opacity:.82}
.donut-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut-c{position:relative;flex:0 0 176px;width:176px;height:176px}
.donut-mid{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;pointer-events:none;
}
.donut-mid .v{font-family:var(--f-display);font-size:25px;font-weight:600;line-height:1.15}
.donut-mid .l{font-size:11.5px;color:var(--ink-3)}
.legend{flex:1;min-width:160px;display:flex;flex-direction:column;gap:8px}
.legend-i{display:flex;align-items:center;gap:9px;font-size:13px}
.legend-d{flex:0 0 11px;width:11px;height:11px;border-radius:4px}
.legend-i .l{flex:1;min-width:0;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-i .v{font-weight:600;font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:flex;align-items:center;gap:11px;font-size:13px}
.bar-lb{flex:0 0 88px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-tr{flex:1;height:11px;border-radius:99px;background:var(--c60-sink);overflow:hidden}
.bar-fl{height:100%;border-radius:99px;background:var(--c10-grad);transition:width .8s var(--ease)}
.bar-vl{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:600;font-size:12.5px;min-width:64px;text-align:right}
.prog{height:8px;border-radius:99px;background:var(--c60-sink);overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px;background:var(--c10-grad);transition:width .7s var(--ease)}
.prog.is-ok i{background:linear-gradient(90deg,#10b981,#059669)}
.prog.is-warn i{background:linear-gradient(90deg,#f59e0b,#d97706)}
.prog.is-bad i{background:linear-gradient(90deg,#f43f5e,#dc2626)}

/* ═══════════════════════════════════════════════════════════════
   20) ปุ่มลัด (Quick Action)
   ═══════════════════════════════════════════════════════════════ */
.qa-grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.qa{
  display:flex;flex-direction:column;align-items:center;gap:9px;padding:17px 10px;
  border-radius:var(--r-l);border:1px solid var(--line);background:var(--c60-raise);
  cursor:pointer;text-align:center;transition:all .22s var(--ease);
}
.qa:hover{transform:translateY(-4px);box-shadow:var(--sh-3);border-color:var(--c10-ring)}
.qa-ic{
  width:47px;height:47px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#fff;box-shadow:0 8px 18px rgba(15,23,42,.14);
}
.qa .lb{font-size:12.5px;font-weight:600;line-height:1.35;color:var(--ink-2)}
.qa.is-busy{opacity:.6;pointer-events:none}

/* ═══════════════════════════════════════════════════════════════
   21) หน้าเช็กชื่อ
   ═══════════════════════════════════════════════════════════════ */
.att-grid{display:grid;gap:11px;grid-template-columns:repeat(auto-fill,minmax(258px,1fr))}
.att-card{
  background:var(--c60-raise);border:1px solid var(--line);border-radius:var(--r-l);padding:13px;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
}
.att-card.is-set{border-color:var(--c10-ring);box-shadow:0 4px 14px rgba(79,70,229,.1)}
.att-card.is-alert{border-left:4px solid var(--bad)}
.att-top{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.att-no{
  flex:0 0 28px;height:28px;border-radius:9px;background:var(--c60-sink);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;
}
.att-nm{flex:1;min-width:0}
.att-nm .n{font-size:13.5px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-nm .s{font-size:11px;color:var(--ink-3)}
.att-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.att-b{
  height:38px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--c60-raise);
  color:var(--ink-3);cursor:pointer;font-size:11.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  transition:all .16s var(--ease);
}
.att-b i{font-size:13px}
.att-b:hover{border-color:var(--c10-ring);color:var(--c10)}
.att-b.on-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.att-b.on-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.att-b.on-warn{background:var(--warn);border-color:var(--warn);color:#fff}
.att-b.on-info{background:var(--info);border-color:var(--info);color:#fff}
.att-b.on-late{background:var(--late);border-color:var(--late);color:#fff}
.att-b.on-acc{background:var(--acc);border-color:var(--acc);color:#fff}
.att-more{display:flex;gap:6px;margin-top:6px}
.att-note{flex:1;height:33px;font-size:12.5px}
.att-hist{display:flex;gap:5px;margin-top:8px;font-size:10.5px;color:var(--ink-3);flex-wrap:wrap}
.att-hist b{color:var(--bad)}
.stick-bar{
  position:sticky;bottom:0;z-index:30;display:flex;align-items:center;gap:11px;flex-wrap:wrap;
  padding:13px 18px;margin:16px -26px -60px;background:color-mix(in srgb,var(--c60-raise) 92%,transparent);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);box-shadow:0 -6px 22px rgba(15,23,42,.07);
}
.stick-sum{display:flex;gap:13px;flex-wrap:wrap;font-size:12.5px}
.stick-sum b{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* ── ตารางประวัติการมาเรียน ─────────────────────────────────── */
.mark{
  display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;
  border-radius:7px;font-size:11px;font-weight:700;
}
.mk-present{background:var(--ok-soft);color:var(--ok)}
.mk-absent{background:var(--bad-soft);color:var(--bad)}
.mk-sick{background:var(--warn-soft);color:var(--warn)}
.mk-leave{background:var(--info-soft);color:var(--info)}
.mk-late{background:var(--late-soft);color:var(--late)}
.mk-event{background:var(--acc-soft);color:var(--acc)}
.mk-other{background:var(--mut-soft);color:var(--mut)}
.mk-none{background:transparent;color:var(--ink-3)}

/* ═══════════════════════════════════════════════════════════════
   22) โปรไฟล์นักเรียน
   ═══════════════════════════════════════════════════════════════ */
.pf-head{
  position:relative;overflow:hidden;border-radius:var(--r-xl);padding:24px 26px;color:#fff;margin-bottom:18px;
  background:linear-gradient(125deg,var(--brand-700),var(--brand-500) 55%,var(--brand-alt));
  box-shadow:var(--sh-brand);
}
.pf-head::after{content:'';position:absolute;right:-50px;bottom:-80px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
.pf-row{position:relative;z-index:1;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pf-photo{
  flex:0 0 92px;width:92px;height:92px;border-radius:26px;overflow:hidden;
  background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:31px;font-weight:600;
}
.pf-photo img{width:100%;height:100%;object-fit:cover}
.pf-info{flex:1;min-width:200px}
.pf-name{font-family:var(--f-display);font-size:23px;font-weight:600;line-height:1.25}
.pf-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pf-tag{
  display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:99px;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.28);font-size:12px;font-weight:500;
}
.pf-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:10px;margin-top:18px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.tab{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:10px 15px;border:0;background:transparent;
  color:var(--ink-2);font-family:var(--f-display);font-size:13.5px;font-weight:500;cursor:pointer;
  border-bottom:2.5px solid transparent;white-space:nowrap;transition:all .18s var(--ease);
}
.tab:hover{color:var(--c10)}
.tab.is-on{color:var(--c10);border-bottom-color:var(--c10);font-weight:600}
.tab .n{font-size:11px;font-weight:700;padding:0 6px;border-radius:99px;background:var(--c60-sink);color:var(--ink-2)}
.tab.is-on .n{background:var(--c30-soft);color:var(--c10)}

/* ═══════════════════════════════════════════════════════════════
   23) หน้าเข้าสู่ระบบ — เวทีแยกสองฝั่ง + คลื่น WebGL
   ═══════════════════════════════════════════════════════════════ */
.login-page{
  /* ★ ต้องระบุแกนให้ชัด — ลูกคือ .login-stage กับ .lp-foot ที่ต่างก็ประกาศ width:100%
     ถ้าไม่ระบุ flex-direction จะได้ row (ค่าเริ่มต้น) → สองก้อนไปเรียงข้างกันแล้วบีบกันจนล้น */
  position:relative;min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;overflow:hidden;
  background:linear-gradient(150deg,#0f172a,#1e1b4b 42%,#4c1d95);
}
#wave-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#wave-canvas.is-off{display:none}
/* ภาพหน้าปกที่ผู้ดูแลอัปโหลด — ต้องใช้ <img referrerpolicy="no-referrer"> ไม่ใช่ background-image
   เพราะลิงก์ lh3 ต้องส่ง referrer policy จึงจะโหลดได้ (CSS ตั้งค่านั้นไม่ได้) */
.lp-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
.lp-hero-ov{position:absolute;inset:0;z-index:0;background:#0f172a;pointer-events:none}
.login-page::before{
  content:'';position:absolute;inset:-25%;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 22% 26%,rgba(99,102,241,.42),transparent 46%),
    radial-gradient(circle at 78% 22%,rgba(139,92,246,.36),transparent 44%),
    radial-gradient(circle at 32% 82%,rgba(56,189,248,.28),transparent 45%),
    radial-gradient(circle at 82% 78%,rgba(236,72,153,.22),transparent 44%);
  filter:blur(38px);animation:blob 15s var(--ease) infinite alternate;
}
@keyframes blob{0%{transform:translate(0,0) scale(1)}100%{transform:translate(3%,-3%) scale(1.09)}}
.lp-parts{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.lp-parts i{
  position:absolute;bottom:-14px;width:5px;height:5px;border-radius:50%;
  background:rgba(255,255,255,.5);animation:float linear infinite;
}
@keyframes float{to{transform:translateY(-106vh);opacity:0}}
.login-stage{
  position:relative;z-index:1;display:grid;grid-template-columns:1.1fr 1fr;
  width:100%;max-width:1060px;border-radius:30px;overflow:hidden;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(22px);box-shadow:0 40px 90px rgba(0,0,0,.5);
  animation:stageIn .55s var(--ease);
}
@keyframes stageIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.lp-brand{padding:44px 40px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:22px}
.lp-logo{
  width:66px;height:66px;border-radius:21px;background:var(--c10-grad);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:700;font-size:24px;box-shadow:0 16px 38px rgba(99,102,241,.45);
}
.lp-logo img{width:100%;height:100%;object-fit:cover;border-radius:21px}
.lp-brand h1{font-size:29px;font-weight:600;line-height:1.25;color:#fff}
.lp-brand .tag{font-size:14px;opacity:.78;line-height:1.75;max-width:400px}
.lp-feats{display:flex;flex-direction:column;gap:12px}
.lp-feat{display:flex;align-items:flex-start;gap:12px}
.lp-feat .ic{
  flex:0 0 38px;height:38px;border-radius:12px;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:16px;
}
.lp-feat .t{font-family:var(--f-display);font-weight:600;font-size:14px}
.lp-feat .d{font-size:12.5px;opacity:.72;line-height:1.6}
.lp-form{padding:40px 36px;background:rgba(255,255,255,.05);display:flex;flex-direction:column;justify-content:center}
.lp-mini{display:none;align-items:center;gap:11px;margin-bottom:20px}
.lp-form h2{font-size:24px;font-weight:600;color:#fff;line-height:1.3}
.lp-form .sub{font-size:13px;color:rgba(255,255,255,.66);margin:5px 0 22px}
.lf{display:flex;flex-direction:column;gap:14px}
.lf.is-shake{animation:shake .42s var(--ease)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.lf-wrap{
  position:relative;display:flex;align-items:center;height:50px;border-radius:14px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
}
.lf-wrap:focus-within{border-color:#a5b4fc;box-shadow:0 0 0 4px rgba(99,102,241,.18)}
.lf-ic{position:absolute;left:15px;color:rgba(255,255,255,.45);font-size:16px;transition:color .2s var(--ease)}
.lf-wrap:focus-within .lf-ic{color:#a5b4fc}
.lf-wrap input{
  flex:1;height:100%;border:0;background:transparent;outline:none;color:#fff;
  padding:0 46px 0 44px;font-size:14.5px;
}
.lf-wrap input::placeholder{color:rgba(255,255,255,.38)}
.lf-wrap input:-webkit-autofill{-webkit-text-fill-color:#f1f5f9;-webkit-box-shadow:inset 0 0 0 1000px #1e1b4b}
.lf-eye{
  position:absolute;right:9px;width:34px;height:34px;border:0;border-radius:10px;background:transparent;
  color:rgba(255,255,255,.5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;
}
.lf-eye:hover{color:#fff;background:rgba(255,255,255,.1)}

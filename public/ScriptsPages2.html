<script type="text/x-app-pages2">
(function (W) {
  'use strict';
  var A = W.APP;
  var $ = A.$, $$ = A.$$, esc = A.esc, fmt = A.fmt, num = A.num, TH = A.TH;
  var Store = A.Store, call = A.call, hasCap = A.hasCap, toast = A.toast;
  var hero = A.hero, panel = A.panel, statCard = A.statCard, emptyBox = A.emptyBox;
  var skeleton = A.skeleton, pager = A.pager, avatar = A.avatar, badge = A.badge;
  var modal = A.modal, modalClose = A.modalClose, runAction = A.runAction;
  var buttonStates = A.buttonStates, confirmBox = A.confirmBox, selectOptions = A.selectOptions;
  var Routes = A.Routes, guard = A.guard, loading = A.loading, fail = A.failPage;
  var docHead = A.docHead, docSign = A.docSign, printBtn = A.printBtn;
  var fieldTxt = A.fieldTxt, fieldSel = A.fieldSel, readForm = A.readForm, attMark = A.attMark;

  /* ═══════════════════════════════════════════════════════════
     เช็กชื่อประจำวัน — หน้าที่ครูใช้ทุกวัน
     ═══════════════════════════════════════════════════════════ */
  var ATT = { date: '', class_id: '', draft: {} };

  var ATT_BTN = [
    { st: 'มา', ic: 'check-lg', tone: 'ok' },
    { st: 'ขาด', ic: 'x-lg', tone: 'bad' },
    { st: 'ลาป่วย', ic: 'heart-pulse', tone: 'warn' },
    { st: 'ลากิจ', ic: 'briefcase', tone: 'info' },
    { st: 'มาสาย', ic: 'clock', tone: 'late' },
    { st: 'กิจกรรม', ic: 'flag', tone: 'acc' },
    { st: 'อื่น ๆ', ic: 'three-dots', tone: 'mut' }
  ];

  Routes['#/attendance'] = {
    cap: 'attendance.view_all|attendance.view_own|attendance.manage',
    render: function (page, q) {
      if (q && q.cls) ATT.class_id = q.cls;
      if (q && q.date) ATT.date = q.date;
      if (!ATT.date) ATT.date = TH.iso(new Date());
      loading(page, 'hero');
      loadAtt(page);
    }
  };

  function loadAtt(page) {
    call('attendance.sheet', { date: ATT.date, class_id: ATT.class_id }).then(function (d) {
      var p = guard('#/attendance');
      if (!p) return;
      ATT.class_id = d.class_id;
      ATT.date = d.date;
      ATT.draft = {};
      (d.items || []).forEach(function (it) {
        ATT.draft[it.student_id] = { status: it.status, note: it.note, check_time: it.check_time };
      });
      paintAtt(p, d);
    }).catch(function (e) { fail('#/attendance', e); });
  }

  function paintAtt(page, d) {
    var k = d.kpi || {};
    var can = (d.can || {}).manage;
    var cards = (d.items || []).map(function (it) { return attCard(it, can); }).join('');

    page.innerHTML =
      '<div class="pr-hide">' + hero({
        pill: TH.dateWeekday(d.date), pillIcon: 'calendar-check-fill', title: 'เช็กชื่อ ' + d.class_name,
        sub: 'กดปุ่มสถานะของนักเรียนแต่ละคน หรือใช้ปุ่มลัดด้านล่างเพื่อตั้งค่าทั้งห้องแล้วแก้เฉพาะคนที่ต่าง',
        icon: 'ui-checks',
        actions: can ? '<button class="btn btn-glass" type="button" id="att-all-present">' +
          '<i class="bi bi-check-all"></i> มาเรียนทั้งห้อง</button>' +
          '<button class="btn btn-glass" type="button" id="att-clear"><i class="bi bi-eraser-fill"></i> ล้างที่เลือก</button>' +
          printBtn('พิมพ์บัญชีเรียกชื่อ') : printBtn('พิมพ์บัญชีเรียกชื่อ'),
        kpis: [
          { icon: 'people-fill', label: 'นักเรียนทั้งหมด', value: fmt(k.total), unit: 'คน' },
          { icon: 'check-circle-fill', label: 'มาเรียน', value: fmt(k.present), unit: 'คน' },
          { icon: 'x-circle-fill', label: 'ขาดเรียน', value: fmt(k.absent), unit: 'คน' },
          { icon: 'heart-pulse-fill', label: 'ลาป่วย', value: fmt(k.sick), unit: 'คน' },
          { icon: 'briefcase-fill', label: 'ลากิจ', value: fmt(k.leave), unit: 'คน' },
          { icon: 'clock-fill', label: 'มาสาย', value: fmt(k.late), unit: 'คน' }
        ]
      }) + '</div>' +
      '<div class="toolbar no-print">' +
      '<div class="field" style="margin:0;flex:0 1 190px"><label style="font-size:11.5px">วันที่</label>' +
      '<input class="inp" type="date" id="att-date" value="' + esc(d.date) + '" max="' + esc(TH.iso(new Date())) + '"></div>' +
      '<div class="field" style="margin:0;flex:1 1 200px"><label style="font-size:11.5px">ห้องเรียน</label>' +
      '<select class="sel" id="att-class">' + selectOptions(d.classes || [], d.class_id, 'id', 'name') + '</select></div>' +
      '<div class="row" style="margin-left:auto;gap:6px">' +
      '<button class="btn btn-ghost btn-sm" type="button" id="att-prev"><i class="bi bi-chevron-left"></i> วันก่อน</button>' +
      '<button class="btn btn-ghost btn-sm" type="button" id="att-today">วันนี้</button>' +
      '<button class="btn btn-ghost btn-sm" type="button" id="att-next">วันถัดไป <i class="bi bi-chevron-right"></i></button>' +
      '</div>' +
      '</div>' +
      docHead('บัญชีเรียกชื่อนักเรียน', d.class_name + ' · ' + TH.dateLong(d.date)) +
      (k.total ? '<div class="att-grid no-print" id="att-list">' + cards + '</div>' + attPrintTable(d)
        : panel({
          body: emptyBox({
            icon: 'person-x', title: 'ยังไม่มีนักเรียนในห้องนี้',
            text: 'เพิ่มนักเรียนเข้าห้องเรียนก่อนจึงจะเช็กชื่อได้',
            action: '<button class="btn btn-primary" type="button" data-hash="#/students"><i class="bi bi-people-fill"></i> ไปที่ทะเบียนนักเรียน</button>'
          })
        })) +
      (can && k.total ? '<div class="stick-bar no-print">' +
        '<div class="stick-sum" id="att-sum"></div>' +
        '<span style="flex:1"></span>' +
        '<button class="btn btn-primary" type="button" id="att-save" data-state="idle">' +
        buttonStates('บันทึกการเช็กชื่อ', 'cloud-arrow-up-fill') + '</button>' +
        '</div>' : '') +
      docSign([
        { role: 'ครูประจำชั้น', name: (Store.user || {}).full_name || '' },
        { role: (Store.settings || {}).director_position || 'ผู้อำนวยการโรงเรียน', name: (Store.settings || {}).director_name || '' }
      ]);

    wireAtt(d);
    updateAttSummary();
  }

  function attCard(it, can) {
    var cur = (ATT.draft[it.student_id] || {}).status || '';
    var btns = ATT_BTN.map(function (b) {
      return '<button class="att-b' + (cur === b.st ? ' on-' + b.tone : '') + '" type="button" ' +
        'data-att-set="' + esc(it.student_id) + '" data-st="' + esc(b.st) + '"' + (can ? '' : ' disabled') + '>' +
        '<i class="bi bi-' + esc(b.ic) + '"></i><span>' + esc(b.st) + '</span></button>';
    }).join('');
    var h = it.hist || {};
    return '<div class="att-card' + (cur ? ' is-set' : '') + (it.alert ? ' is-alert' : '') + '" id="attc-' + esc(it.student_id) + '">' +
      '<div class="att-top">' +
      '<div class="att-no">' + esc(it.number || '-') + '</div>' +
      avatar({ url: it.photo_url, name: it.name, size: 'sm' }) +
      '<div class="att-nm"><div class="n">' + esc(it.name) + '</div>' +
      '<div class="s">' + (it.nickname ? esc(it.nickname) + ' · ' : '') + esc(it.code) + '</div></div>' +
      (it.watch_level !== 'ทั่วไป' ? '<i class="bi bi-exclamation-triangle-fill" style="color:var(--warn)" title="' + esc(it.watch_level) + '"></i>' : '') +
      '</div>' +
      '<div class="att-btns">' + btns + '</div>' +
      '<div class="att-more">' +
      '<input class="inp att-note" type="text" placeholder="หมายเหตุ (ถ้ามี)" data-att-note="' + esc(it.student_id) + '" ' +
      'value="' + esc((ATT.draft[it.student_id] || {}).note || '') + '"' + (can ? '' : ' disabled') + '>' +
      '</div>' +
      ((h.absent || h.late) ? '<div class="att-hist">' +
        (h.absent ? '<span>30 วันล่าสุด: ขาด <b>' + h.absent + '</b> ครั้ง</span>' : '') +
        (h.late ? '<span>สาย <b>' + h.late + '</b> ครั้ง</span>' : '') +
        '</div>' : '') +
      '</div>';
  }

  function attPrintTable(d) {
    var rows = (d.items || []).map(function (it) {
      var st = (ATT.draft[it.student_id] || {}).status || '';
      var mk = attMark(st);
      return '<tr><td class="n">' + esc(it.number) + '</td>' +
        '<td class="prpara">' + esc(it.name) + '</td>' +
        '<td class="n">' + (st ? mk.ch : '') + '</td>' +
        '<td class="n">' + esc(st) + '</td>' +
        '<td class="prpara">' + esc((ATT.draft[it.student_id] || {}).note || '') + '</td></tr>';
    }).join('');
    return '<div class="pr-only"><table class="prtable">' +
      '<colgroup><col style="width:9%"><col style="width:41%"><col style="width:10%"><col style="width:18%"><col style="width:22%"></colgroup>' +
      '<thead><tr><th>เลขที่</th><th>ชื่อ-สกุล</th><th>เครื่องหมาย</th><th>สถานะ</th><th>หมายเหตุ</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>' +
      '<div style="margin-top:8px;font-size:10pt">เครื่องหมาย: / = มาเรียน · x = ขาดเรียน · ป = ลาป่วย · ก = ลากิจ · ส = มาสาย · + = เข้าร่วมกิจกรรม</div>' +
      '</div>';
  }

  function wireAtt(d) {
    var dt = $('#att-date');
    if (dt) dt.addEventListener('change', function () { ATT.date = dt.value; loadAtt($('#page')); });
    var cl = $('#att-class');
    if (cl) cl.addEventListener('change', function () { ATT.class_id = cl.value; loadAtt($('#page')); });
    var pv = $('#att-prev');
    if (pv) pv.addEventListener('click', function () { ATT.date = TH.shift(ATT.date, -1); loadAtt($('#page')); });
    var nx = $('#att-next');
    if (nx) nx.addEventListener('click', function () {
      var next = TH.shift(ATT.date, 1);
      if (next > TH.iso(new Date())) { toast('เลือกวันที่ล่วงหน้าไม่ได้', 'warn'); return; }
      ATT.date = next; loadAtt($('#page'));
    });
    var td = $('#att-today');
    if (td) td.addEventListener('click', function () { ATT.date = TH.iso(new Date()); loadAtt($('#page')); });

    $$('[data-att-set]').forEach(function (b) {
      b.addEventListener('click', function () {
        var sid = b.getAttribute('data-att-set');
        var st = b.getAttribute('data-st');
        if (!ATT.draft[sid]) ATT.draft[sid] = {};
        ATT.draft[sid].status = (ATT.draft[sid].status === st) ? '' : st;
        var card = $('#attc-' + sid);
        if (card) {
          $$('[data-att-set="' + sid + '"]', card).forEach(function (x) {
            ATT_BTN.forEach(function (m) { x.classList.remove('on-' + m.tone); });
          });
          if (ATT.draft[sid].status) {
            var meta = ATT_BTN.filter(function (m) { return m.st === ATT.draft[sid].status; })[0];
            if (meta) b.classList.add('on-' + meta.tone);
          }
          card.classList.toggle('is-set', !!ATT.draft[sid].status);
        }
        updateAttSummary();
      });
    });
    $$('[data-att-note]').forEach(function (inp) {
      inp.addEventListener('input', function () {
        var sid = inp.getAttribute('data-att-note');
        if (!ATT.draft[sid]) ATT.draft[sid] = {};
        ATT.draft[sid].note = inp.value;
      });
    });
    var allP = $('#att-all-present');
    if (allP) {
      allP.addEventListener('click', function () {
        (d.items || []).forEach(function (it) {
          if (!ATT.draft[it.student_id]) ATT.draft[it.student_id] = {};
          ATT.draft[it.student_id].status = 'มา';
        });
        paintAtt($('#page'), d);
        toast('ตั้งเป็น "มาเรียน" ทั้งห้องแล้ว — แก้เฉพาะคนที่ต่างได้เลย', 'ok');
      });
    }
    var clr = $('#att-clear');
    if (clr) {
      clr.addEventListener('click', function () {
        Object.keys(ATT.draft).forEach(function (kk) { ATT.draft[kk].status = ''; });
        paintAtt($('#page'), d);
      });
    }
    var save = $('#att-save');
    if (save) {
      save.addEventListener('click', function () {
        var items = Object.keys(ATT.draft).filter(function (sid) { return !!ATT.draft[sid].status; })
          .map(function (sid) {
            return { student_id: sid, status: ATT.draft[sid].status, note: ATT.draft[sid].note || '' };
          });
        if (!items.length) { toast('ยังไม่ได้เลือกสถานะให้นักเรียนคนใดเลย', 'warn'); return; }
        runAction(save, {}, function () {
          return call('attendance.save', { date: ATT.date, class_id: ATT.class_id, items: items }).then(function (r) {
            Store.home = null;
            toast('บันทึก ' + fmt(r.saved) + ' รายการเรียบร้อย', 'ok', 'เช็กชื่อสำเร็จ');
            loadAtt($('#page'));
          });
        });
      });
    }
  }

  function updateAttSummary() {
    var box = $('#att-sum');
    if (!box) return;
    var c = { 'มา': 0, 'ขาด': 0, 'ลาป่วย': 0, 'ลากิจ': 0, 'มาสาย': 0, 'กิจกรรม': 0, 'อื่น ๆ': 0 };
    var done = 0;
    Object.keys(ATT.draft).forEach(function (kk) {
      var st = ATT.draft[kk].status;
      if (st) { c[st] = (c[st] || 0) + 1; done++; }
    });
    box.innerHTML = '<span>เลือกแล้ว <b>' + done + '</b> คน</span>' +
      Object.keys(c).filter(function (kk) { return c[kk] > 0; }).map(function (kk) {
        return '<span>' + esc(kk) + ' <b>' + c[kk] + '</b></span>';
      }).join('');
  }

  /* ═══════════════════════════════════════════════════════════
     ประวัติการมาเรียน
     ═══════════════════════════════════════════════════════════ */
  var HIS = { class_id: '', from: '', to: '' };

  Routes['#/att-history'] = {
    cap: 'attendance.view_all|attendance.view_own|attendance.view_self',
    render: function (page) {
      if (!HIS.to) { HIS.to = TH.iso(new Date()); HIS.from = TH.shift(HIS.to, -29); }
      loading(page, 'hero');
      loadHistory(page);
    }
  };

  function loadHistory(page) {
    call('attendance.history', HIS).then(function (d) {
      var p = guard('#/att-history');
      if (!p) return;
      HIS.class_id = d.class_id;
      paintHistory(p, d);
    }).catch(function (e) { fail('#/att-history', e); });
  }

  function paintHistory(page, d) {
    var k = d.kpi || {};
    var dates = d.dates || [];
    var head = '<th class="ctr">เลขที่</th><th>ชื่อ-สกุล</th>' +
      dates.map(function (dd) {
        return '<th class="ctr" title="' + esc(TH.dateLong(dd)) + '">' + esc(TH.parse(dd) ? TH.parse(dd).getDate() : '') +
          '<br><small style="font-weight:400">' + esc(TH.dowShort(dd)) + '</small></th>';
      }).join('') +
      '<th class="ctr">มา</th><th class="ctr">ขาด</th><th class="ctr">สาย</th><th class="ctr">อัตรา</th>';
    var body = (d.rows || []).map(function (r) {
      return '<tr><td class="ctr">' + esc(r.number || '-') + '</td>' +
        '<td><b>' + esc(r.name) + '</b></td>' +
        dates.map(function (dd) {
          var mk = attMark(r.days[dd] || '');
          return '<td class="ctr">' + (r.days[dd] ? '<span class="mark ' + mk.cls + '" title="' + esc(r.days[dd]) + '">' + mk.ch + '</span>' : '<span class="mark mk-none">·</span>') + '</td>';
        }).join('') +
        '<td class="ctr">' + r.present + '</td><td class="ctr">' + r.absent + '</td>' +
        '<td class="ctr">' + r.late + '</td>' +
        '<td class="ctr"><b style="color:' + (r.rate >= 90 ? 'var(--ok)' : (r.rate >= 75 ? 'var(--warn)' : 'var(--bad)')) + '">' + r.rate + '%</b></td>' +
        '</tr>';
    }).join('');

    page.innerHTML =
      '<div class="pr-hide">' + hero({
        pill: d.class_name, pillIcon: 'clock-history', title: 'ประวัติการมาเรียน',
        sub: 'ตารางย้อนหลังพร้อมสถิติรายบุคคล — เลื่อนแนวนอนเพื่อดูวันที่ทั้งหมด',
        icon: 'clock-history',
        actions: printBtn('พิมพ์สรุปการมาเรียน'),
        kpis: [
          { icon: 'percent', label: 'อัตราการมาเรียน', value: num(d.rate, 0), unit: '%' },
          { icon: 'check-circle-fill', label: 'มาเรียน', value: fmt(k.present), unit: 'ครั้ง' },
          { icon: 'x-circle-fill', label: 'ขาดเรียน', value: fmt(k.absent), unit: 'ครั้ง' },
          { icon: 'clock-fill', label: 'มาสาย', value: fmt(k.late), unit: 'ครั้ง' },
          { icon: 'heart-pulse-fill', label: 'ลาป่วย/ลากิจ', value: fmt(num(k.sick, 0) + num(k.leave, 0)), unit: 'ครั้ง' }
        ]
      }) + '</div>' +
      '<div class="toolbar no-print">' +
      '<div class="field" style="margin:0;flex:0 1 170px"><label style="font-size:11.5px">ตั้งแต่วันที่</label>' +
      '<input class="inp" type="date" id="his-from" value="' + esc(d.from) + '"></div>' +
      '<div class="field" style="margin:0;flex:0 1 170px"><label style="font-size:11.5px">ถึงวันที่</label>' +
      '<input class="inp" type="date" id="his-to" value="' + esc(d.to) + '"></div>' +
      '<div class="field" style="margin:0;flex:1 1 190px"><label style="font-size:11.5px">ห้องเรียน</label>' +
      '<select class="sel" id="his-class"><option value="">ทุกห้องที่ดูแล</option>' +
      selectOptions(d.classes || [], d.class_id, 'id', 'name') + '</select></div>' +
      '<div class="chips" style="margin-left:auto">' +
      '<button class="chip" type="button" data-range="7">7 วัน</button>' +
      '<button class="chip" type="button" data-range="30">30 วัน</button>' +
      '<button class="chip" type="button" data-range="90">1 ภาคเรียน</button>' +
      '</div>' +
      '</div>' +
      docHead('สรุปการมาเรียนของนักเรียน', d.class_name + ' · ' + TH.dateLong(d.from) + ' ถึง ' + TH.dateLong(d.to)) +
      ((d.rows || []).length ? panel({
        flush: true,
        body: '<div class="tbl-wrap"><table class="tbl tbl-mini"><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>',
        foot: '<div style="font-size:11.5px;color:var(--ink-2)">เครื่องหมาย: ' +
          '<span class="mark mk-present">/</span> มาเรียน · <span class="mark mk-absent">x</span> ขาดเรียน · ' +
          '<span class="mark mk-sick">ป</span> ลาป่วย · <span class="mark mk-leave">ก</span> ลากิจ · ' +
          '<span class="mark mk-late">ส</span> มาสาย · <span class="mark mk-event">+</span> เข้าร่วมกิจกรรม</div>'
      }) : panel({
        body: emptyBox({
          icon: 'calendar-x', title: 'ยังไม่มีข้อมูลในช่วงเวลานี้',
          text: 'ลองขยายช่วงวันที่ หรือเริ่มเช็กชื่อเพื่อให้มีข้อมูล',
          action: '<button class="btn btn-primary" type="button" data-hash="#/attendance"><i class="bi bi-ui-checks"></i> ไปเช็กชื่อ</button>'
        })
      })) +
      docSign();

    var f = $('#his-from');
    if (f) f.addEventListener('change', function () { HIS.from = f.value; loadHistory($('#page')); });
    var t = $('#his-to');
    if (t) t.addEventListener('change', function () { HIS.to = t.value; loadHistory($('#page')); });
    var c = $('#his-class');
    if (c) c.addEventListener('change', function () { HIS.class_id = c.value; loadHistory($('#page')); });
    $$('[data-range]').forEach(function (b) {
      b.addEventListener('click', function () {
        HIS.to = TH.iso(new Date());

  /* ═══════════════════════════════════════════════════════════

  var STU_CACHE = null;

  function loadStudentOptions() {
    if (STU_CACHE) return Promise.resolve(STU_CACHE);
    return call('student.options', {}).then(function (d) {
      STU_CACHE = d.items || [];
      return STU_CACHE;
    });
  }

  function studentSelect(current, id) {
    var opts = (STU_CACHE || []).map(function (s) {
      return '<option value="' + esc(s.id) + '"' + (String(current || '') === String(s.id) ? ' selected' : '') + '>' +
        esc(s.name) + (s.nickname ? ' (' + esc(s.nickname) + ')' : '') + ' — ' + esc(s.level) + '/' + esc(s.room) +
        ' เลขที่ ' + esc(s.number) + '</option>';
    }).join('');
    return '<div class="field"><label>นักเรียน<span class="req">*</span></label>' +
      '<select class="sel" data-f="student_id" id="' + esc(id || 'sel-stu') + '" required>' +
      '<option value="">— เลือกนักเรียน —</option>' + opts + '</select>' +

     บันทึกประจำวันของครู
     ═══════════════════════════════════════════════════════════ */
  var DLY = { q: '', class_id: '', category: '', page: 1 };

    }).catch(function (e) { fail('#/daily', e); });
  }

        sub: 'บันทึกสิ่งที่เกิดขึ้นในแต่ละวัน — กิจกรรม เหตุการณ์ ปัญหา และแนวทางดำเนินการ',
        icon: 'journal-text',
        actions: (can ? '<button class="btn btn-glass" type="button" id="dly-add"><i class="bi bi-plus-lg"></i> เพิ่มบันทึก</button>' : '') + printBtn(),

          { icon: 'journals', label: 'บันทึกทั้งหมด', value: fmt(k.total), unit: 'รายการ' },
          { icon: 'calendar-day-fill', label: 'วันนี้', value: fmt(k.today), unit: 'รายการ' },
          { icon: 'calendar-week-fill', label: '7 วันล่าสุด', value: fmt(k.week), unit: 'รายการ' },

        ]
      }) + '</div>' +
      filterBar('dly', d.classes, d.categories, DLY, 'ค้นหาหัวข้อบันทึก…') +
      docHead('บันทึกประจำวันของครูประจำชั้น', ((Store.year && Store.year.label) || '')) +
      (d.total ? '<div class="grid g-auto sd-stagger">' + cards + '</div>'
        : panel({
          body: emptyBox({
            icon: 'journal-plus', title: 'ยังไม่มีบันทึกประจำวัน',
            text: 'บันทึกกิจกรรมหน้าเสาธง เหตุการณ์ในห้องเรียน หรืองานที่ได้รับมอบหมายไว้ที่นี่',
            action: can ? '<button class="btn btn-primary" type="button" id="dly-add2"><i class="bi bi-plus-lg"></i> เพิ่มบันทึกแรก</button>' : ''
          })
        })) +
      '<div class="no-print">' + pager({ page: d.page, pages: d.pages, total: d.total }) + '</div>' +
      docSign();

    wireFilterBar('dly', DLY, function () { loadDaily($('#page')); });
    ['#dly-add', '#dly-add2'].forEach(function (sel) {
      var el = $(sel);
      if (el) el.addEventListener('click', function () { openDailyForm('', d); });

  function filterBar(prefix, classes, categories, state, placeholder) {
    return '<div class="toolbar no-print">' +
      '<div class="tb-search"><i class="bi bi-search"></i>' +
      '<input class="inp" type="search" id="' + prefix + '-q" placeholder="' + esc(placeholder) + '" value="' + esc(state.q || '') + '"></div>' +
      (classes ? '<select class="sel tb-sel" id="' + prefix + '-class"><option value="">ทุกห้องเรียน</option>' +
        selectOptions(classes, state.class_id, 'id', 'name') + '</select>' : '') +
      (categories ? '<select class="sel tb-sel" id="' + prefix + '-cat"><option value="">ทุกประเภท</option>' +
        (categories || []).map(function (c) {
          return '<option value="' + esc(c) + '"' + (state.category === c || state.type === c ? ' selected' : '') + '>' + esc(c) + '</option>';
        }).join('') + '</select>' : '') +
      '<button class="btn btn-ghost btn-sm" type="button" id="' + prefix + '-clear"><i class="bi bi-x-circle"></i> ล้างตัวกรอง</button>' +
      '</div>';
  }

  function wireFilterBar(prefix, state, reload) {
    var q = $('#' + prefix + '-q');
    if (q) q.addEventListener('input', A.debounce(function () { state.q = q.value; state.page = 1; reload(); }, 300));
    var cl = $('#' + prefix + '-class');
    if (cl) cl.addEventListener('change', function () { state.class_id = cl.value; state.page = 1; reload(); });
    var ct = $('#' + prefix + '-cat');
    if (ct) ct.addEventListener('change', function () {
      if (state.type !== undefined) state.type = ct.value; else state.category = ct.value;
      state.page = 1; reload();
    });
    var cr = $('#' + prefix + '-clear');
    if (cr) cr.addEventListener('click', function () {
      state.q = ''; state.class_id = ''; state.page = 1;
      if (state.type !== undefined) state.type = '';
      if (state.category !== undefined) state.category = '';
      if (state.status !== undefined) state.status = '';
      reload();
    });
    $$('.pager button').forEach(function (b) {
      b.addEventListener('click', function () { state.page = num(b.getAttribute('data-page'), 1); reload(); });
    });
  }

          (r.result ? '<div class="sec"><div class="sec-t"><i class="bi bi-check2-circle"></i> ผลการดำเนินงาน</div>' +

    var k = d.kpi || {}, can = (d.can || {}).manage;
    var cards = (d.items || []).map(function (r) {

        (r.photo_url ? '<img src="' + esc(r.photo_url) + '" alt="ภาพบ้านนักเรียน" referrerpolicy="no-referrer" ' +

        '<div class="ic-head">' + avatar({ url: r.student.photo_url, name: r.student.name, size: 'lg', square: true }) +
        '<div class="who"><div class="ic-name">' + esc(r.student.name) + '</div>' +
        '<div class="ic-sub">' + esc(r.student.class_name) + '</div></div>' +
        badge(r.status, r.tone) + '</div>' +
        '<div class="ic-meta">' +
        '<span><i class="bi bi-calendar3"></i> ' + esc(TH.date(r.visit_date)) + '</span>' +
        '<span><i class="bi bi-person-walking"></i> ' + esc((r.visitor || '').slice(0, 30)) + '</span>' +
        (r.next_date ? '<span style="color:var(--warn)"><i class="bi bi-alarm"></i> ติดตาม ' + esc(TH.date(r.next_date)) + '</span>' : '') +
        '</div>' +
        '</div>';
    }).join('');

    var notVisited = (d.not_visited || []).map(function (s) {
      return '<div class="lst-row" data-visit-new="' + esc(s.id) + '">' +
        avatar({ url: s.photo_url, name: s.name, size: 'sm' }) +
        '<div class="main"><div class="t">' + esc(s.name) + '</div><div class="s">' + esc(s.class_name) + '</div></div>' +
        '<div class="r">' + (can ? '<button class="btn btn-soft btn-sm" type="button">' +
          '<i class="bi bi-house-add-fill"></i> บันทึกเยี่ยม</button>' : badge('ยังไม่ได้เยี่ยม', 'mut')) + '</div>' +
        '</div>';
    }).join('');

    page.innerHTML =
      '<div class="pr-hide">' + hero({
        pill: 'ดูแลช่วยเหลือนักเรียน', pillIcon: 'house-heart-fill', title: 'เยี่ยมบ้านนักเรียน',
        sub: 'แบบบันทึกออกแบบให้กรอกจากมือถือขณะอยู่หน้างานได้ทันที พร้อมแนบภาพถ่ายและพิกัด',
        icon: 'house-heart-fill',
        actions: (can ? '<button class="btn btn-glass" type="button" id="vis-add"><i class="bi bi-plus-lg"></i> บันทึกการเยี่ยมบ้าน</button>' : '') + printBtn(),
        kpis: [
          { icon: 'journals', label: 'บันทึกทั้งหมด', value: fmt(k.total), unit: 'ครั้ง' },
          { icon: 'house-check-fill', label: 'เยี่ยมแล้ว', value: fmt(k.visited), unit: 'ครั้ง' },
          { icon: 'calendar-event-fill', label: 'นัดหมายแล้ว', value: fmt(k.appointed), unit: 'ครั้ง' },
          { icon: 'arrow-repeat', label: 'ต้องติดตาม', value: fmt(k.followup), unit: 'ครั้ง' },
          { icon: 'house-slash-fill', label: 'ยังไม่เคยเยี่ยม', value: fmt(d.not_visited_total), unit: 'คน' }
        ]
      }) + '</div>' +
      '<div class="toolbar no-print">' +
      '<div class="tb-search"><i class="bi bi-search"></i>' +
      '<input class="inp" type="search" id="vis-q" placeholder="ค้นหาชื่อนักเรียน…" value="' + esc(VIS.q) + '"></div>' +
      '<select class="sel tb-sel" id="vis-class"><option value="">ทุกห้องเรียน</option>' +
      selectOptions(d.classes || [], VIS.class_id, 'id', 'name') + '</select>' +
      '<div class="chips">' +
      A.chip('vst', '', 'ทั้งหมด', VIS.status === '') +
      (d.statuses || []).map(function (s) { return A.chip('vst', s, s, VIS.status === s); }).join('') +
      '</div>' +
      '<button class="btn btn-ghost btn-sm" type="button" id="vis-clear"><i class="bi bi-x-circle"></i> ล้างตัวกรอง</button>' +
      '</div>' +

      (d.total ? '<div class="grid g-auto sd-stagger">' + cards + '</div>'

          body: emptyBox({
            icon: 'house-add', title: 'ยังไม่มีบันทึกการเยี่ยมบ้าน',

            action: can ? '<button class="btn btn-primary" type="button" id="vis-add2"><i class="bi bi-plus-lg"></i> บันทึกครั้งแรก</button>' : ''
          })
        })) +
      '<div class="no-print">' + pager({ page: d.page, pages: d.pages, total: d.total }) + '</div>' +
      (notVisited ? panel({
        title: 'นักเรียนที่ยังไม่เคยเยี่ยมบ้าน', sub: 'รวม ' + fmt(d.not_visited_total) + ' คน — งานที่ยังค้างอยู่',

        body: '<div class="lst">' + notVisited + '</div>'

      el.addEventListener('click', function () { openVisitForm('', el.getAttribute('data-visit-new'), d); });
    });
    $$('[data-vis]').forEach(function (el) {
      el.addEventListener('click', function () { openVisitView(el.getAttribute('data-vis'), d); });
    });
  }

          '<dl class="dl">' + A.dlRow('สภาพแวดล้อม', r.environment) + A.dlRow('ความสัมพันธ์ในครอบครัว', r.relationship) +
          A.dlRow('การสนับสนุนด้านการเรียน', r.learning_support) + '</dl></div>' +
          (r.problems ? '<div class="sec"><div class="sec-t"><i class="bi bi-exclamation-triangle-fill"></i> ปัญหา / ความต้องการ</div>' +

              if (!yes) return;
              call('visit.delete', { id: r.id }).then(function () {
                modalClose(); toast('ลบเรียบร้อย', 'ok'); loadVisit($('#page'));
              }).catch(function (e) { toast(e.message, 'bad'); });
            });
          });
        }
      });
    }).catch(function (e) { A.spinHide(); toast(e.message, 'bad'); });

  /* ═══════════════════════════════════════════════════════════
     คัดกรอง / ติดตามช่วยเหลือนักเรียน (Case)
     ═══════════════════════════════════════════════════════════ */
  var CAS = { q: '', class_id: '', status: '', level: '', page: 1 };

  Routes['#/cases'] = {
    cap: 'case.view_all|case.view_own',
    render: function (page, q) {
      loading(page, 'hero');
      loadCase(page, q && q.id);
    }
  };

  function loadCase(page, openId) {
    call('case.list', CAS).then(function (d) {
      var p = guard('#/cases');
      if (!p) return;
      paintCase(p, d);
      if (openId) openCaseView(openId, d);
    }).catch(function (e) { fail('#/cases', e); });
  }

    var k = d.kpi || {}, can = (d.can || {}).manage;
    var cards = (d.items || []).map(function (r) {

        '<div class="ic-head">' + avatar({ url: r.student.photo_url, name: r.student.name, size: 'lg', square: true }) +
        '<div class="who"><div class="ic-name">' + esc(r.student.name) + '</div>' +
        '<div class="ic-sub">' + esc(r.student.class_name) + ' · ' + esc(r.case_no) + '</div></div>' +
        badge(r.status, r.tone) + '</div>' +
        '<div style="margin-bottom:7px">' + badge(r.level, r.level === 'ส่งต่อ' ? 'bad' : 'warn') + ' ' + badge(r.category, 'mut') + '</div>' +
        '<div class="ic-body">' + esc((r.problem || '').slice(0, 130)) + '</div>' +
        '<div class="ic-meta">' +
        '<span><i class="bi bi-calendar3"></i> เปิด ' + esc(TH.date(r.opened_at)) + '</span>' +
        '<span><i class="bi bi-arrow-repeat"></i> ติดตาม ' + r.followup_count + ' ครั้ง</span>' +
        (r.next_date ? '<span style="color:' + (r.overdue ? 'var(--bad)' : 'var(--warn)') + '">' +
          '<i class="bi bi-alarm-fill"></i> นัด ' + esc(TH.smart(r.next_date)) + '</span>' : '') +
        '</div>' +
        '<div class="ic-foot"><span class="sp"></span>' +
        '<span style="font-size:11.5px;color:var(--ink-3)"><i class="bi bi-person-badge"></i> ' + esc(r.owner || '—') + '</span></div>' +
        '</div>';
    }).join('');

    page.innerHTML =
      '<div class="pr-hide">' + hero({
        pill: 'ระบบดูแลช่วยเหลือนักเรียน', pillIcon: 'life-preserver', title: 'คัดกรองและติดตามนักเรียน',
        sub: 'วงจรการช่วยเหลือ: ระบุปัญหา → บันทึกข้อมูล → กำหนดแนวทาง → ดำเนินการ → ติดตามผล → ปิดเคส',
        icon: 'life-preserver',
        actions: (can ? '<button class="btn btn-glass" type="button" id="cas-add"><i class="bi bi-plus-lg"></i> เปิดเคสใหม่</button>' : '') + printBtn(),
        kpis: [
          { icon: 'folder-fill', label: 'เคสทั้งหมด', value: fmt(k.total), unit: 'เคส' },
          { icon: 'folder-plus', label: 'เปิดเคส', value: fmt(k.open), unit: 'เคส' },
          { icon: 'arrow-repeat', label: 'กำลังดำเนินการ', value: fmt(k.progress), unit: 'เคส' },
          { icon: 'check-circle-fill', label: 'ปิดเคสแล้ว', value: fmt(k.closed), unit: 'เคส' },
          { icon: 'alarm-fill', label: 'เลยกำหนดติดตาม', value: fmt(k.overdue), unit: 'เคส' }
        ]
      }) + '</div>' +
      panel({
        title: 'จำนวนเคสตามระดับการดูแล', icon: 'bar-chart-fill', tone: 'bad', cls: 'no-print',
        body: A.svgHorizBar({ data: d.by_level || [], suffix: 'เคส' })
      }) +
      '<div class="toolbar no-print">' +
      '<div class="tb-search"><i class="bi bi-search"></i>' +
      '<input class="inp" type="search" id="cas-q" placeholder="ค้นหาเลขเคส ชื่อนักเรียน หรือปัญหา…" value="' + esc(CAS.q) + '"></div>' +
      '<select class="sel tb-sel" id="cas-class"><option value="">ทุกห้องเรียน</option>' +
      selectOptions(d.classes || [], CAS.class_id, 'id', 'name') + '</select>' +
      '<select class="sel tb-sel" id="cas-level"><option value="">ทุกระดับ</option>' +
      (d.levels || []).map(function (l) {
        return '<option value="' + esc(l) + '"' + (CAS.level === l ? ' selected' : '') + '>' + esc(l) + '</option>';
      }).join('') + '</select>' +
      '<div class="chips">' +
      A.chip('cst', '', 'ทั้งหมด', CAS.status === '') +
      (d.statuses || []).map(function (s) { return A.chip('cst', s, s, CAS.status === s); }).join('') +
      '</div>' +
      '<button class="btn btn-ghost btn-sm" type="button" id="cas-clear"><i class="bi bi-x-circle"></i> ล้างตัวกรอง</button>' +
      '</div>' +
      docHead('รายงานการดูแลช่วยเหลือนักเรียน', ((Store.year && Store.year.label) || '')) +
      (d.total ? '<div class="grid g-auto sd-stagger">' + cards + '</div>'
        : panel({
          body: emptyBox({
            icon: 'emoji-smile', title: 'ยังไม่มีเคสติดตาม',
            text: 'เมื่อพบนักเรียนที่ต้องได้รับการดูแลเป็นพิเศษ ให้เปิดเคสเพื่อวางแผนช่วยเหลือและติดตามผล',
            action: can ? '<button class="btn btn-primary" type="button" id="cas-add2"><i class="bi bi-plus-lg"></i> เปิดเคสแรก</button>' : ''
          })
        })) +
      '<div class="no-print">' + pager({ page: d.page, pages: d.pages, total: d.total }) + '</div>' +
      docSign();

    var q = $('#cas-q');
    if (q) q.addEventListener('input', A.debounce(function () { CAS.q = q.value; CAS.page = 1; loadCase($('#page')); }, 300));
    var cl = $('#cas-class');
    if (cl) cl.addEventListener('change', function () { CAS.class_id = cl.value; CAS.page = 1; loadCase($('#page')); });
    var lv = $('#cas-level');
    if (lv) lv.addEventListener('change', function () { CAS.level = lv.value; CAS.page = 1; loadCase($('#page')); });
    $$('[data-chip="cst"]').forEach(function (b) {
      b.addEventListener('click', function () { CAS.status = b.getAttribute('data-val'); CAS.page = 1; loadCase($('#page')); });
    });
    var cr = $('#cas-clear');
    if (cr) cr.addEventListener('click', function () { CAS.q = ''; CAS.class_id = ''; CAS.status = ''; CAS.level = ''; CAS.page = 1; loadCase($('#page')); });
    $$('.pager button').forEach(function (b) {
      b.addEventListener('click', function () { CAS.page = num(b.getAttribute('data-page'), 1); loadCase($('#page')); });
    });
    ['#cas-add', '#cas-add2'].forEach(function (sel) {
      var el = $(sel);
      if (el) el.addEventListener('click', function () { openCaseForm(null, d); });
    });
    $$('[data-case]').forEach(function (el) {
      el.addEventListener('click', function () { openCaseView(el.getAttribute('data-case'), d); });
    });
  }

  function openCaseView(id, ctx) {
    A.spinShow('กำลังเปิดข้อมูลเคส');
    call('case.get', { id: id }).then(function (d) {
      A.spinHide();
      var r = d.item || {}, s = d.student || {}, can = (d.can || {}).manage;
      var fups = (d.followups || []).map(function (f) {
        return '<div class="tl-item"><div class="tl-ic t-info"><i class="bi bi-arrow-repeat"></i></div>' +
          '<div class="tl-t">' + esc(TH.dateLong(f.date)) + '</div>' +
          '<div class="tl-d">' + esc(f.detail) + '</div>' +
          (f.result ? '<div class="tl-d" style="color:var(--ok)"><i class="bi bi-check2"></i> ' + esc(f.result) + '</div>' : '') +
          '<div class="tl-w"><i class="bi bi-person"></i> ' + esc(f.by || '—') +
          (f.next_date ? ' · <i class="bi bi-alarm"></i> นัดครั้งต่อไป ' + esc(TH.date(f.next_date)) : '') + '</div>' +
          '</div>';
      }).join('');

      modal({
        size: 'lg', custom: true,
        header: '<div class="mh-hero"><button class="x" type="button" data-close="1" aria-label="ปิด"><i class="bi bi-x-lg"></i></button>' +
          '<div class="mh-row">' + avatar({ url: s.photo_url, name: s.name, size: 'xl' }) +
          '<div style="min-width:0"><div class="mh-t">' + esc(r.case_no) + '</div>' +
          '<div class="mh-s">' + esc(s.name) + ' · ' + esc(s.class_name) + ' · ' + esc(r.category) + '</div></div></div>' +
          '<div class="mh-stats">' +
          '<div class="mh-stat"><div class="l">สถานะ</div><div class="v" style="font-size:14px">' + esc(r.status) + '</div></div>' +
          '<div class="mh-stat"><div class="l">ระดับการดูแล</div><div class="v" style="font-size:14px">' + esc(r.level) + '</div></div>' +
          '<div class="mh-stat"><div class="l">ติดตามแล้ว</div><div class="v">' + (d.followups || []).length + '</div></div>' +
          '</div></div>',
        body:
          '<div class="sec"><div class="sec-t"><i class="bi bi-exclamation-circle-fill"></i> ปัญหาที่พบ</div>' +
          '<div style="font-size:13.5px;line-height:1.8">' + esc(r.problem) + '</div></div>' +
          (r.cause ? '<div class="sec"><div class="sec-t"><i class="bi bi-search"></i> สาเหตุ</div>' +
            '<div style="font-size:13.5px;line-height:1.8">' + esc(r.cause) + '</div></div>' : '') +
          (r.plan ? '<div class="sec"><div class="sec-t"><i class="bi bi-lightbulb-fill"></i> แนวทางช่วยเหลือ</div>' +
            '<div style="font-size:13.5px;line-height:1.8">' + esc(r.plan) + '</div></div>' : '') +
          (r.result ? '<div class="sec"><div class="sec-t"><i class="bi bi-flag-fill"></i> ผลการดำเนินการ</div>' +
            '<div style="font-size:13.5px;line-height:1.8">' + esc(r.result) + '</div></div>' : '') +
          '<div class="sec"><dl class="dl">' +
          A.dlRow('ผู้รับผิดชอบ', r.owner) + A.dlRow('เปิดเคสเมื่อ', TH.dateLong(r.opened_at)) +
          A.dlRow('นัดติดตามครั้งต่อไป', r.next_date ? TH.dateLong(r.next_date) : '—') +
          A.dlRow('ปิดเคสเมื่อ', r.closed_at ? TH.dateLong(r.closed_at) : '—') + '</dl></div>' +
          '<div class="sec"><div class="sec-t"><i class="bi bi-clock-history"></i> ประวัติการติดตาม</div>' +
          (fups ? '<div class="tl">' + fups + '</div>'
            : emptyBox({ icon: 'clock', title: 'ยังไม่มีการติดตาม', text: 'กดปุ่ม "บันทึกการติดตาม" เพื่อเริ่มบันทึกความคืบหน้า' })) + '</div>' +
          '<div class="sec"><button class="btn btn-soft btn-sm" type="button" data-hash="#/student?id=' + esc(s.id) + '">' +
          '<i class="bi bi-person-vcard-fill"></i> เปิดโปรไฟล์นักเรียน</button></div>',
        footer: can ? '<button class="btn btn-ghost" type="button" data-close="1">ปิด</button>' +
          '<button class="btn btn-ghost" type="button" id="cas-edit"><i class="bi bi-pencil-fill"></i> แก้ไขเคส</button>' +
          (r.status !== 'ปิดเคส' ? '<button class="btn btn-primary" type="button" id="cas-fup">' +
            '<i class="bi bi-arrow-repeat"></i> บันทึกการติดตาม</button>' : '')
          : '<button class="btn btn-ghost" type="button" data-close="1">ปิด</button>',
        onOpen: function (host) {
          var ed = $('#cas-edit', host);
          if (ed) ed.addEventListener('click', function () { modalClose(); openCaseForm(Object.assign({}, r, { student: s }), ctx); });
          var fu = $('#cas-fup', host);
          if (fu) fu.addEventListener('click', function () { modalClose(); openFollowupForm(r); });
        }
      });
    }).catch(function (e) { A.spinHide(); toast(e.message, 'bad'); });
  }

  function openCaseForm(r, ctx) {
    var cur = r || { level: 'เฝ้าระวัง', status: 'เปิดเคส' };
    loadStudentOptions().then(function () {
      modal({
        size: 'lg',
        title: cur.id ? 'แก้ไขเคส ' + (cur.case_no || '') : 'เปิดเคสติดตามนักเรียน',
        icon: 'life-preserver', tone: 'bad',
        body: '<form id="cas-form"><div class="form-grid">' +
          '<div class="field full">' + studentSelect(cur.student ? cur.student.id : '', 'cas-stu') + '</div>' +
          fieldSel('category', 'ประเภทปัญหา', (ctx && ctx.categories) || [], cur.category, true) +
          fieldSel('level', 'ระดับการดูแล', (ctx && ctx.levels) || ['เฝ้าระวัง', 'ต้องติดตาม', 'ต้องช่วยเหลือ', 'ส่งต่อ'], cur.level, true) +
          fieldSel('status', 'สถานะเคส', (ctx && ctx.statuses) || ['เปิดเคส', 'กำลังดำเนินการ', 'ปิดเคส'], cur.status, true) +
          fieldTxt('next_date', 'นัดติดตามครั้งต่อไป', cur.next_date, false, 'date') +
          '<div class="field full"><label>ปัญหาที่พบ<span class="req">*</span></label>' +
          '<textarea class="txt" data-f="problem" rows="2" required>' + esc(cur.problem || '') + '</textarea></div>' +
          '<div class="field"><label>สาเหตุ</label>' +
          '<textarea class="txt" data-f="cause" rows="2">' + esc(cur.cause || '') + '</textarea></div>' +
          '<div class="field"><label>แนวทางช่วยเหลือ</label>' +
          '<textarea class="txt" data-f="plan" rows="2">' + esc(cur.plan || '') + '</textarea></div>' +
          '<div class="field full"><label>ผลการดำเนินการ (กรอกเมื่อปิดเคส)</label>' +
          '<textarea class="txt" data-f="result" rows="2">' + esc(cur.result || '') + '</textarea></div>' +
          '</div>' +
          '<div class="hint" style="margin-top:6px"><i class="bi bi-info-circle"></i> ' +
          'ระบบจะปรับ "ระดับการดูแล" ของนักเรียนให้ตรงกับเคสอัตโนมัติ และสร้างงานติดตามในปฏิทินให้ตามวันที่นัด</div>' +
          '<input type="hidden" data-f="id" value="' + esc(cur.id || '') + '">' +
          '<input type="hidden" data-f="rev" value="' + esc(cur.rev || '') + '"></form>',
        footer: '<button class="btn btn-ghost" type="button" data-close="1"><i class="bi bi-x-lg"></i> ยกเลิก</button>' +
          '<button class="btn btn-primary" type="button" id="cas-save" data-state="idle">' + buttonStates('บันทึกเคส', 'check-lg') + '</button>',
        onOpen: function (host) {
          var sv = $('#cas-save', host);
          if (!sv) return;
          sv.addEventListener('click', function () {
            var data = readForm(host);
            if (!data.student_id) { toast('กรุณาเลือกนักเรียน', 'warn'); return; }
            if (!String(data.problem || '').trim()) { toast('กรุณาระบุปัญหาที่พบ', 'warn'); return; }
            runAction(sv, {}, function () {
              return call('case.save', data).then(function () {
                modalClose(); toast('บันทึกเคสเรียบร้อย', 'ok'); Store.home = null; loadCase($('#page'));
              });
            });
          });
        }
      });
    }).catch(function (e) { toast(e.message, 'bad'); });
  }

  function openFollowupForm(c) {
    modal({
      title: 'บันทึกการติดตาม · ' + (c.case_no || ''),
      icon: 'arrow-repeat', tone: 'info',
      body: '<form id="fup-form"><div class="form-grid">' +
        fieldTxt('date', 'วันที่ติดตาม', TH.iso(new Date()), true, 'date') +
        fieldTxt('next_date', 'นัดครั้งต่อไป', '', false, 'date') +
        '<div class="field full"><label>รายละเอียดการติดตาม<span class="req">*</span></label>' +
        '<textarea class="txt" data-f="detail" rows="3" placeholder="สิ่งที่ดำเนินการและผลที่พบ" required></textarea></div>' +
        '<div class="field full"><label>ผลการติดตาม</label>' +
        '<textarea class="txt" data-f="result" rows="2"></textarea></div>' +
        '<div class="field full"><label class="switch"><input type="checkbox" data-f="close_case">' +
        '<span class="track"></span><span class="lb">ปิดเคสนี้ (นักเรียนดีขึ้นแล้ว ไม่ต้องติดตามต่อ)</span></label></div>' +
        '</div>' +
        '<input type="hidden" data-f="case_id" value="' + esc(c.id) + '"></form>',
      footer: '<button class="btn btn-ghost" type="button" data-close="1"><i class="bi bi-x-lg"></i> ยกเลิก</button>' +
        '<button class="btn btn-primary" type="button" id="fup-save" data-state="idle">' + buttonStates('บันทึกการติดตาม', 'check-lg') + '</button>',
      onOpen: function (host) {
        var sv = $('#fup-save', host);
        if (!sv) return;
        sv.addEventListener('click', function () {
          var data = readForm(host);
          if (!String(data.detail || '').trim()) { toast('กรุณากรอกรายละเอียดการติดตาม', 'warn'); return; }
          runAction(sv, {}, function () {
            return call('case.followup', data).then(function () {
              modalClose();
              toast(data.close_case ? 'ปิดเคสเรียบร้อย' : 'บันทึกการติดตามเรียบร้อย', 'ok');
              Store.home = null;
              loadCase($('#page'));
            });
          });
        });
      }
    });
  }

  A.RESETTERS.push(function () {
    ATT.date = ''; ATT.class_id = ''; ATT.draft = {};
    HIS.class_id = ''; HIS.from = ''; HIS.to = '';
    STU_CACHE = null;
    DLY.q = ''; DLY.class_id = ''; DLY.category = ''; DLY.page = 1;
    BEH.q = ''; BEH.class_id = ''; BEH.type = ''; BEH.severity = ''; BEH.page = 1;
    CON.q = ''; CON.channel = ''; CON.page = 1;
    VIS.q = ''; VIS.class_id = ''; VIS.status = ''; VIS.page = 1;
    CAS.q = ''; CAS.class_id = ''; CAS.status = ''; CAS.level = ''; CAS.page = 1;
  });

  A.loadStudentOptions = loadStudentOptions;
  A.studentSelect = studentSelect;
  A.filterBar = filterBar;
  A.wireFilterBar = wireFilterBar;
})(window);
</script>

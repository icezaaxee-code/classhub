          })
        })) +
      docSign();

    var back = $('#rep-back');
    if (back) back.addEventListener('click', function () { REP.key = ''; A.dispatch(); });
    var fr = $('#rep-from');
    if (fr) fr.addEventListener('change', function () { REP.from = fr.value; });
    var to = $('#rep-to');
    if (to) to.addEventListener('change', function () { REP.to = to.value; });
    var cl = $('#rep-class');
    if (cl) cl.addEventListener('change', function () { REP.class_id = cl.value; });
    var run = $('#rep-run');
    if (run) run.addEventListener('click', function () { runReport(idx); });
    var csv = $('#rep-csv');
    if (csv) csv.addEventListener('click', function () {
      A.downloadCSV(d.title, d.head, d.rows);
      toast('ส่งออก ' + fmt((d.rows || []).length) + ' แถวเรียบร้อย', 'ok');
    });
  }

  /* ═══════════════════════════════════════════════════════════
     ห้องเรียน
     ═══════════════════════════════════════════════════════════ */
  Routes['#/classes'] = {
    cap: 'student.view_all|student.view_own',
    render: function (page) {
      loading(page, 'hero');
      Promise.all([call('class.list', {}), hasCap('master.manage') ? call('user.options', {}) : Promise.resolve({ items: [] })])
        .then(function (res) {
          var p = guard('#/classes');
          if (!p) return;
          paintClasses(p, res[0], res[1].items || []);
        }).catch(function (e) { fail('#/classes', e); });
    }
  };

  function paintClasses(page, d, teachers) {
    var can = hasCap('master.manage');
    var total = 0, male = 0, female = 0;
    (d.items || []).forEach(function (c) { total += c.student_count; male += c.male; female += c.female; });
    var cards = (d.items || []).map(function (c) {
      var pct = c.capacity ? Math.round((c.student_count / c.capacity) * 100) : 0;
      return '<div class="item-card" data-cls="' + esc(c.id) + '">' +
        '<div class="ic-head"><div class="stat-ic t-brand" style="font-size:16px">' +
        '<b style="font-family:var(--f-display)">' + esc(c.level) + '</b></div>' +
        '<div class="who"><div class="ic-name">' + esc(c.name) + '</div>' +
        '<div class="ic-sub"><i class="bi bi-person-video3"></i> ' + esc(c.homeroom_name || 'ยังไม่ได้กำหนดครูประจำชั้น') + '</div></div>' +
        badge(c.student_count + ' คน', 'brand') + '</div>' +
        '<div class="ic-meta">' +
        '<span><i class="bi bi-gender-male"></i> ชาย ' + c.male + '</span>' +
        '<span><i class="bi bi-gender-female"></i> หญิง ' + c.female + '</span>' +
        (c.capacity ? '<span><i class="bi bi-people"></i> ความจุ ' + c.capacity + '</span>' : '') +
        '</div>' +
        (c.capacity ? '<div style="margin-top:10px"><div class="prog is-' + (pct > 100 ? 'bad' : 'ok') + '">' +
          '<i style="width:' + Math.min(100, pct) + '%"></i></div></div>' : '') +
        '<div class="ic-foot">' +
        '<button class="btn btn-soft btn-sm" type="button" data-hash="#/students?cls=' + esc(c.id) + '">' +
        '<i class="bi bi-people-fill"></i> ดูนักเรียน</button>' +
        '<span class="sp"></span>' +
        (can ? '<button class="btn btn-ghost btn-sm btn-icon" type="button" data-cls-edit="' + esc(c.id) + '">' +
          '<i class="bi bi-pencil-fill"></i></button>' : '') +
        '</div>' +
        '</div>';
    }).join('');

    page.innerHTML =
      hero({
        pill: (Store.year && Store.year.label) || '', pillIcon: 'door-open-fill', title: 'ห้องเรียนและครูประจำชั้น',
        sub: 'ข้อมูลพื้นฐานของห้องเรียนที่คุณรับผิดชอบในปีการศึกษาปัจจุบัน',
        icon: 'door-open-fill',
        actions: can ? '<button class="btn btn-glass" type="button" id="cls-add"><i class="bi bi-plus-lg"></i> เพิ่มห้องเรียน</button>' +
          '<button class="btn btn-glass" type="button" data-hash="#/years"><i class="bi bi-calendar2-range-fill"></i> จัดการปีการศึกษา</button>' : '',
        kpis: [
          { icon: 'door-open-fill', label: 'ห้องเรียน', value: fmt((d.items || []).length), unit: 'ห้อง' },
          { icon: 'people-fill', label: 'นักเรียนรวม', value: fmt(total), unit: 'คน' },
          { icon: 'gender-male', label: 'ชาย', value: fmt(male), unit: 'คน' },
          { icon: 'gender-female', label: 'หญิง', value: fmt(female), unit: 'คน' }
        ]
      }) +
      ((d.items || []).length ? '<div class="grid g-auto sd-stagger">' + cards + '</div>'
        : panel({
          body: emptyBox({
            icon: 'door-closed', title: 'ยังไม่มีห้องเรียนในปีการศึกษานี้',
            text: 'สร้างห้องเรียนก่อนจึงจะเพิ่มนักเรียนและเช็กชื่อได้',
            action: can ? '<button class="btn btn-primary" type="button" id="cls-add2"><i class="bi bi-plus-lg"></i> สร้างห้องเรียนแรก</button>' : ''
          })
        }));

    ['#cls-add', '#cls-add2'].forEach(function (sel) {
      var el = $(sel);
      if (el) el.addEventListener('click', function () { openClassForm(null, teachers); });
    });
    $$('[data-cls-edit]').forEach(function (b) {
      b.addEventListener('click', function (ev) {
        ev.stopPropagation();
        var id = b.getAttribute('data-cls-edit');
        var c = (d.items || []).filter(function (x) { return x.id === id; })[0];
        if (c) openClassForm(c, teachers);
      });
    });
  }

  function openClassForm(c, teachers) {
    var cur = c || { level: 'ป.1', room: '1', capacity: 25 };
    var LEVELS = ['อ.1', 'อ.2', 'อ.3', 'ป.1', 'ป.2', 'ป.3', 'ป.4', 'ป.5', 'ป.6', 'ม.1', 'ม.2', 'ม.3'];
    modal({
      title: cur.id ? 'แก้ไขห้องเรียน ' + cur.name : 'เพิ่มห้องเรียน',
      icon: 'door-open-fill', tone: 'brand',
      body: '<form id="cls-form"><div class="form-grid">' +
        fieldSel('level', 'ระดับชั้น', LEVELS, cur.level, true) +
        fieldTxt('room', 'ห้อง', cur.room, true, 'text') +
        fieldTxt('name', 'ชื่อห้องเรียน (เว้นว่างให้ระบบตั้งให้)', cur.name, false, 'text') +
        fieldTxt('capacity', 'ความจุ (คน)', cur.capacity, false, 'number') +
        '<div class="field"><label>ครูประจำชั้น</label>' +
        '<select class="sel" data-f="homeroom_id"><option value="">ยังไม่กำหนด</option>' +
        selectOptions(teachers, cur.homeroom_id, 'id', 'full_name') + '</select></div>' +
        '<div class="field"><label>ครูผู้ช่วยประจำชั้น</label>' +
        '<select class="sel" data-f="assistant_id"><option value="">ยังไม่กำหนด</option>' +
        selectOptions(teachers, cur.assistant_id, 'id', 'full_name') + '</select></div>' +
        '<div class="field full"><label>หมายเหตุ</label><textarea class="txt" data-f="note" rows="2">' + esc(cur.note || '') + '</textarea></div>' +
        '</div>' +
        '<input type="hidden" data-f="id" value="' + esc(cur.id || '') + '">' +
        '<input type="hidden" data-f="rev" value="' + esc(cur.rev || '') + '"></form>',
      footer: '<button class="btn btn-ghost" type="button" data-close="1"><i class="bi bi-x-lg"></i> ยกเลิก</button>' +
        (cur.id ? '<button class="btn btn-danger btn-icon" type="button" id="cls-del"><i class="bi bi-trash-fill"></i></button>' : '') +
        '<button class="btn btn-primary" type="button" id="cls-save" data-state="idle">' + buttonStates('บันทึก', 'check-lg') + '</button>',
      onOpen: function (host) {
        var h = $('[data-f="homeroom_id"]', host);
        if (h) h.value = cur.homeroom_id || '';
        var a = $('[data-f="assistant_id"]', host);
        if (a) a.value = cur.assistant_id || '';
        var sv = $('#cls-save', host);
        if (sv) sv.addEventListener('click', function () {
          var data = readForm(host);
          if (!data.level) { toast('กรุณาเลือกระดับชั้น', 'warn'); return; }
          if (!String(data.room || '').trim()) { toast('กรุณากรอกห้อง', 'warn'); return; }
          runAction(sv, {}, function () {
            return call('class.save', data).then(function () {
              modalClose(); toast('บันทึกห้องเรียนเรียบร้อย', 'ok'); A.bustCache(); A.reloadAll();
            });
          });
        });
        var dl = $('#cls-del', host);
        if (dl) dl.addEventListener('click', function () {
          confirmBox({ title: 'ลบห้องเรียน', text: 'ลบได้เฉพาะห้องที่ไม่มีนักเรียนอยู่แล้วเท่านั้น', okText: 'ลบห้องเรียน' })
            .then(function (yes) {
              if (!yes) return;
              call('class.delete', { id: cur.id }).then(function () {
                modalClose(); toast('ลบห้องเรียนเรียบร้อย', 'ok'); A.reloadAll();
              }).catch(function (e) { toast(e.message, 'bad'); });
            });
        });
      }
    });
  }

  /* ═══════════════════════════════════════════════════════════
     ปีการศึกษา
     ═══════════════════════════════════════════════════════════ */
  Routes['#/years'] = {
    cap: 'master.manage',
    render: function (page) {
      loading(page, 'list');
      call('year.list', {}).then(function (d) {
        var p = guard('#/years');
        if (!p) return;
        var rows = (d.items || []).map(function (y) {
          return '<div class="lst-row" data-year="' + esc(y.id) + '">' +
            '<div class="panel-ic s-' + (y.is_active ? 'ok' : 'mut') + '"><i class="bi bi-calendar2-range-fill"></i></div>' +
            '<div class="main"><div class="t">' + esc(y.label) + (y.is_active ? ' ' + badge('ใช้งานอยู่', 'ok') : '') + '</div>' +
            '<div class="s">' + esc(y.start_date ? TH.date(y.start_date) : '—') + ' ถึง ' +
            esc(y.end_date ? TH.date(y.end_date) : '—') + ' · สถานะ ' + esc(y.status) + '</div></div>' +
            '<div class="r">' + (!y.is_active ? '<button class="btn btn-soft btn-sm" type="button" data-year-use="' + esc(y.id) + '">' +
              '<i class="bi bi-check2-circle"></i> ใช้ปีนี้</button> ' : '') +
            '<button class="btn btn-ghost btn-sm btn-icon" type="button" data-year-edit="' + esc(y.id) + '">' +
            '<i class="bi bi-pencil-fill"></i></button></div>' +
            '</div>';
        }).join('');
        p.innerHTML =
          hero({
            pill: 'ตั้งค่าระบบ', pillIcon: 'calendar2-range-fill', title: 'ปีการศึกษาและภาคเรียน',
            sub: 'ระบบรองรับหลายปีการศึกษา — ข้อมูลย้อนหลังจะไม่ถูกลบเมื่อเปิดปีการศึกษาใหม่',
            icon: 'calendar2-range-fill',
            actions: '<button class="btn btn-glass" type="button" id="yr-add"><i class="bi bi-plus-lg"></i> เพิ่มปีการศึกษา</button>',
            kpis: [
              { icon: 'calendar-range-fill', label: 'ปีการศึกษาทั้งหมด', value: fmt((d.items || []).length), unit: 'รายการ' },
              { icon: 'check-circle-fill', label: 'ที่ใช้งานอยู่', value: (d.items || []).filter(function (x) { return x.is_active; }).length ? '1' : '0' }
            ]
          }) +
          panel({
            title: 'รายการปีการศึกษา', sub: 'เลือก "ใช้ปีนี้" เพื่อกำหนดปีการศึกษาปัจจุบันของระบบ',
            icon: 'list-ul', tone: 'brand', flush: true,
            body: rows ? '<div class="lst">' + rows + '</div>'
              : emptyBox({ icon: 'calendar-x', title: 'ยังไม่มีปีการศึกษา', text: 'สร้างปีการศึกษาก่อนจึงจะสร้างห้องเรียนได้' })
          });
        var add = $('#yr-add');
        if (add) add.addEventListener('click', function () { openYearForm(null); });
        $$('[data-year-edit]').forEach(function (b) {
          b.addEventListener('click', function (ev) {
            ev.stopPropagation();
            var id = b.getAttribute('data-year-edit');
            openYearForm((d.items || []).filter(function (x) { return x.id === id; })[0]);
          });
        });
        $$('[data-year-use]').forEach(function (b) {
          b.addEventListener('click', function (ev) {
            ev.stopPropagation();
            call('year.active', { id: b.getAttribute('data-year-use') }).then(function () {
              toast('เปลี่ยนปีการศึกษาปัจจุบันเรียบร้อย', 'ok');
              A.reloadAll();
            }).catch(function (e) { toast(e.message, 'bad'); });
          });
        });
      }).catch(function (e) { fail('#/years', e); });
    }
  };

  function openYearForm(y) {
    var thisYear = new Date().getFullYear() + 543;
    var cur = y || { year: thisYear, term: 1, status: 'เปิด' };
    modal({
      title: cur.id ? 'แก้ไขปีการศึกษา' : 'เพิ่มปีการศึกษา',
      icon: 'calendar2-plus-fill', tone: 'brand',
      body: '<form id="yr-form"><div class="form-grid">' +
        fieldTxt('year', 'ปีการศึกษา (พ.ศ.)', cur.year, true, 'number') +
        fieldSel('term', 'ภาคเรียนที่', ['1', '2', '3'], String(cur.term), true) +
        fieldTxt('label', 'ชื่อที่แสดง (เว้นว่างให้ระบบตั้งให้)', cur.label, false, 'text') +
        fieldSel('status', 'สถานะ', ['เปิด', 'ปิด'], cur.status, false) +
        fieldTxt('start_date', 'วันเปิดภาคเรียน', cur.start_date, false, 'date') +
        fieldTxt('end_date', 'วันปิดภาคเรียน', cur.end_date, false, 'date') +
        '<div class="field full"><label>หมายเหตุ</label><textarea class="txt" data-f="note" rows="2">' + esc(cur.note || '') + '</textarea></div>' +
        '</div>' +
        '<input type="hidden" data-f="id" value="' + esc(cur.id || '') + '">' +
        '<input type="hidden" data-f="rev" value="' + esc(cur.rev || '') + '"></form>',
      footer: '<button class="btn btn-ghost" type="button" data-close="1"><i class="bi bi-x-lg"></i> ยกเลิก</button>' +
        (cur.id ? '<button class="btn btn-danger btn-icon" type="button" id="yr-del"><i class="bi bi-trash-fill"></i></button>' : '') +
        '<button class="btn btn-primary" type="button" id="yr-save" data-state="idle">' + buttonStates('บันทึก', 'check-lg') + '</button>',
      onOpen: function (host) {
        var sv = $('#yr-save', host);
        if (sv) sv.addEventListener('click', function () {
          var data = readForm(host);
          runAction(sv, {}, function () {
            return call('year.save', data).then(function () {
              modalClose(); toast('บันทึกปีการศึกษาเรียบร้อย', 'ok'); A.dispatch();
            });
          });
        });
        var dl = $('#yr-del', host);
        if (dl) dl.addEventListener('click', function () {
          confirmBox({ title: 'ลบปีการศึกษา', text: 'ลบได้เฉพาะปีที่ยังไม่มีห้องเรียนผูกอยู่', okText: 'ลบ' }).then(function (yes) {
            if (!yes) return;
            call('year.delete', { id: cur.id }).then(function () {
              modalClose(); toast('ลบเรียบร้อย', 'ok'); A.dispatch();
            }).catch(function (e) { toast(e.message, 'bad'); });
          });
        });
      }
    });
  }

  A.RESETTERS.push(function () {
    HLT.q = ''; HLT.class_id = ''; HLT.bmi_level = ''; HLT.page = 1;
    INF.q = ''; INF.page = 1;
    ACT.q = ''; ACT.class_id = ''; ACT.category = ''; ACT.page = 1;
    ASG.q = ''; ASG.class_id = ''; ASG.filter = ''; ASG.page = 1;
    CAL.month = ''; CAL.type = ''; CAL.class_id = '';
    DOC.q = ''; DOC.class_id = ''; DOC.category = ''; DOC.page = 1;
    REP.key = ''; REP.class_id = ''; REP.from = ''; REP.to = '';
  });
})(window);
</script>
